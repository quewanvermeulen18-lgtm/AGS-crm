<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>AGS Consult — Pipeline</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; background: #0E0E10; }

  :root {
    --black: #0E0E10;
    --char: #1C1C1F;
    --red: #D81E27;
    --red-deep: #A5151C;
    --red-tint: #FDECEC;
    --white: #FFFFFF;
    --paper: #FAF9F8;
    --line: #E6E3E0;
    --line-dark: #2E2E33;
    --grey: #8A8A8E;
    --grey-soft: #B9B7B4;
    --ink-soft: #5A5A60;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  #root {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--black); background: var(--paper); min-height: 100vh;
    padding-bottom: 86px; font-size: 15px; line-height: 1.45;
    max-width: 720px; margin: 0 auto;
  }
  .boot { padding: 48px 20px; color: var(--grey); background: var(--black); min-height: 100vh; }
  .pad { padding: 0 18px; }

  /* ---------- front page ---------- */
  .front {
    background: var(--black); color: var(--white);
    min-height: 100vh; padding: 40px 20px 48px;
  }
  .front .mark {
    font-size: 13px; font-weight: 700; letter-spacing: 0.14em;
    color: var(--white);
  }
  .front .mark i { color: var(--red); font-style: normal; }
  .front h1 {
    font-size: 40px; line-height: 1.02; font-weight: 700;
    letter-spacing: -0.035em; margin: 26px 0 30px;
  }
  .front h1 em { font-style: normal; color: var(--red); }

  .who-list { display: grid; gap: 9px; }
  .who-btn {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: var(--char); border: 1px solid var(--line-dark); border-radius: 15px;
    padding: 14px 16px; font-family: inherit; color: var(--white);
    cursor: pointer; text-align: left;
  }
  .who-btn:active { background: #26262B; }
  .who-btn .av {
    width: 42px; height: 42px; border-radius: 50%; background: var(--red);
    display: grid; place-items: center; font-size: 15px; font-weight: 700;
    color: var(--white); flex: none; letter-spacing: 0.02em;
  }
  .who-btn .nm { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .who-btn .sub { font-size: 12.5px; color: var(--grey); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .who-btn .go { margin-left: auto; color: var(--grey); font-size: 20px; }

  .who-btn .rm {
    margin-left: auto; background: none; border: 1px solid #3A3A40;
    color: var(--red); width: 34px; height: 34px; border-radius: 50%;
    font-size: 15px; font-family: inherit; cursor: pointer; flex: none;
  }
  .editlist {
    display: block; margin: 20px auto 0; background: none; border: 0;
    color: var(--grey); font-family: inherit; font-size: 14px;
    text-decoration: underline; cursor: pointer; padding: 6px;
  }
  .add-btn {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: none; border: 1px dashed #3A3A40; border-radius: 15px;
    padding: 14px 16px; font-family: inherit; color: var(--grey);
    cursor: pointer; text-align: left; font-size: 15.5px; margin-top: 9px;
  }
  .add-btn .av {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid #3A3A40;
    display: grid; place-items: center; font-size: 21px; color: var(--red); flex: none;
  }
  .front .newbox { margin-top: 14px; }
  .front .newbox input {
    width: 100%; background: var(--char); border: 1px solid var(--line-dark);
    color: var(--white); padding: 14px 16px; border-radius: 15px;
    font-size: 16px; font-family: inherit;
  }
  .front .newbox input::placeholder { color: #5E5E66; }
  .front .newbox input:focus { outline: 2px solid var(--red); outline-offset: 1px; border-color: transparent; }
  .front .err { color: var(--red); font-size: 13.5px; margin-top: 12px; }
  .front .notice { background: none; color: var(--grey); padding: 0; font-size: 12px; margin-top: 24px; border: 0; }

  /* ---------- chrome ---------- */
  .brandbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 18px; background: var(--black); color: var(--white);
  }
  .brandbar .mark { font-size: 12px; font-weight: 700; letter-spacing: 0.13em; }
  .brandbar .mark i { color: var(--red); font-style: normal; }
  .brandbar .who { font-size: 13px; color: var(--grey-soft); }
  .brandbar button {
    background: none; border: 0; font-family: inherit; font-size: 13px;
    color: var(--white); cursor: pointer; padding: 4px 0; text-decoration: underline;
  }
  .notice { padding: 9px 18px; background: var(--red-tint); color: var(--red-deep); font-size: 12.5px; }

  .topline { display: flex; align-items: baseline; justify-content: space-between; padding: 20px 18px 12px; background: var(--white); }
  .topline h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .topline .sub { font-size: 13px; color: var(--grey); }

  /* ---------- hero number ---------- */
  .rate { padding: 4px 18px 22px; background: var(--white); border-bottom: 1px solid var(--line); }
  .rate .fig {
    font-size: 68px; line-height: 0.88; font-weight: 750; letter-spacing: -0.05em;
    font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 3px;
    color: var(--black);
  }
  .rate .fig span.pct { font-size: 27px; font-weight: 600; color: var(--red); letter-spacing: -0.02em; }
  .rate .cap { margin-top: 9px; font-size: 13.5px; color: var(--ink-soft); }

  .streak { display: flex; height: 9px; margin-top: 18px; border-radius: 999px; overflow: hidden; background: var(--line); }
  .streak i { display: block; height: 100%; }
  .streak i.w { background: var(--red); }
  .streak i.l { background: var(--grey-soft); }
  .streak i.o { background: var(--black); }
  .legend { display: flex; gap: 15px; margin-top: 11px; font-size: 12.5px; color: var(--ink-soft); flex-wrap: wrap; }
  .legend b { font-weight: 700; color: var(--black); font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }
  .dot.w { background: var(--red); } .dot.l { background: var(--grey-soft); } .dot.o { background: var(--black); }

  .goal { padding: 16px 18px; background: var(--white); border-bottom: 1px solid var(--line); }
  .goal .lab { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; margin-bottom: 8px; }
  .goal .lab span { color: var(--ink-soft); }
  .goal .lab b { font-variant-numeric: tabular-nums; font-weight: 700; }
  .goal .track { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .goal .fill { height: 100%; background: var(--black); border-radius: 999px; }
  .goal .fill.hit { background: var(--red); }
  .goal .foot { margin-top: 9px; font-size: 12.5px; color: var(--grey); }
  .goal .foot button { background: none; border: 0; font-family: inherit; font-size: 12.5px; color: var(--red); text-decoration: underline; cursor: pointer; padding: 0; }

  .filters { display: flex; gap: 7px; padding: 14px 18px 10px; overflow-x: auto; scrollbar-width: none; background: var(--white); }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    border: 1px solid var(--line); background: var(--white); color: var(--ink-soft);
    padding: 7px 14px; border-radius: 999px; font-size: 13.5px; white-space: nowrap;
    cursor: pointer; font-family: inherit; font-weight: 500;
  }
  .chip[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: var(--white); font-weight: 600; }

  .searchwrap { padding: 2px 18px 10px; background: var(--white); }
  input.search {
    width: 100%; border: 1px solid var(--line); background: var(--paper);
    padding: 11px 13px; border-radius: 11px; font-size: 16px; font-family: inherit; color: var(--black);
  }

  /* ---------- rows ---------- */
  .ledger { border-top: 1px solid var(--line); background: var(--white); }
  .row {
    display: grid; grid-template-columns: 4px 1fr auto; gap: 13px; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--line); background: none;
    border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left;
    font-family: inherit; cursor: pointer;
  }
  .row:active { background: var(--paper); }
  .bar { width: 4px; height: 36px; border-radius: 3px; }
  .bar.w { background: var(--red); } .bar.l { background: var(--grey-soft); } .bar.o { background: var(--black); }
  .row .nm { font-size: 15.5px; font-weight: 620; color: var(--black); }
  .row .meta { font-size: 12.5px; color: var(--grey); margin-top: 2px; }
  .row .val { font-size: 14.5px; font-variant-numeric: tabular-nums; color: var(--black); text-align: right; font-weight: 600; }
  .row .val small { display: block; font-size: 11.5px; color: var(--grey); font-weight: 400; }
  .row .stale { color: var(--red); }

  .empty { padding: 44px 18px; color: var(--ink-soft); font-size: 14.5px; background: var(--white); }
  .empty b { display: block; color: var(--black); font-size: 17px; font-weight: 700; margin-bottom: 6px; }

  .block { padding: 20px 18px; background: var(--white); border-bottom: 1px solid var(--line); }
  .block h2 { font-size: 12px; font-weight: 700; margin: 0 0 4px; letter-spacing: 0.06em; color: var(--red); }
  .block p.hint { font-size: 12.5px; color: var(--grey); margin: 0 0 14px; }

  .stat { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 0; gap: 14px; }
  .stat + .stat { border-top: 1px solid var(--line); }
  .stat .k { font-size: 14.5px; }
  .stat .k small { display: block; color: var(--grey); font-size: 12px; }
  .stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .meter { margin: 12px 0 0; }
  .meter .lab { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 5px; gap: 12px; }
  .meter .lab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meter .lab em { font-style: normal; color: var(--grey); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter .track { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .meter .fill { height: 100%; background: var(--red); border-radius: 999px; }
  .meter.neg .fill { background: var(--grey-soft); }

  /* ---------- forms ---------- */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 600; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid var(--line); background: var(--white); color: var(--black);
    padding: 12px 13px; border-radius: 11px; font-size: 16px; font-family: inherit;
  }
  .field textarea { min-height: 78px; resize: vertical; line-height: 1.5; }
  .field .note { font-size: 12px; color: var(--grey); margin-top: 6px; }
  .field input:focus, .field select:focus, .field textarea:focus, input.search:focus {
    outline: 2px solid var(--red); outline-offset: 1px; border-color: transparent;
  }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  button.btn {
    width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--black);
    background: var(--black); color: var(--white); font-size: 15.5px; font-weight: 620;
    font-family: inherit; cursor: pointer; margin-top: 4px;
  }
  button.btn.ghost { background: var(--white); color: var(--black); border-color: var(--line); }
  button.btn.won { background: var(--red); border-color: var(--red); }
  button.btn.lost { background: var(--white); border-color: var(--grey-soft); color: var(--ink-soft); }
  button.btn.danger { background: none; border-color: var(--red); color: var(--red); }
  button.btn[disabled] { opacity: .5; cursor: default; }
  button.btn:focus-visible, .chip:focus-visible, .row:focus-visible, .tab:focus-visible,
  .who-btn:focus-visible, .add-btn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .backbar { display: flex; align-items: center; gap: 10px; padding: 14px 18px 4px; background: var(--white); }
  .backbar button { background: none; border: 0; font-family: inherit; font-size: 14.5px; color: var(--red); cursor: pointer; padding: 4px 0; font-weight: 500; }

  .dhead { padding: 6px 18px 18px; background: var(--white); border-bottom: 1px solid var(--line); }
  .dhead h2 { font-size: 26px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.03em; }
  .dhead .co { color: var(--ink-soft); font-size: 14.5px; }
  .tag { display: inline-block; margin-top: 11px; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 650; }
  .tag.w { background: var(--red); color: var(--white); }
  .tag.l { background: var(--line); color: var(--ink-soft); }
  .tag.o { background: var(--black); color: var(--white); }

  .kv { display: grid; grid-template-columns: 118px 1fr; gap: 4px 12px; padding: 16px 18px; background: var(--white); border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .kv dt { color: var(--grey); font-size: 13px; padding-top: 1px; }
  .kv dd { margin: 0 0 6px; overflow-wrap: anywhere; }

  .timeline { padding: 18px; background: var(--white); border-bottom: 1px solid var(--line); }
  .timeline h3 { font-size: 12px; color: var(--red); font-weight: 700; letter-spacing: 0.06em; margin: 0 0 13px; }
  .tl { position: relative; padding-left: 18px; }
  .tl::before { content: ""; position: absolute; left: 3px; top: 5px; bottom: 5px; width: 1px; background: var(--line); }
  .tl .item { position: relative; padding-bottom: 15px; font-size: 14px; }
  .tl .item::before { content: ""; position: absolute; left: -18px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .tl .item .when { font-size: 12.5px; color: var(--grey); }

  .actions { padding: 18px; display: grid; gap: 10px; background: var(--white); }
  a.link { color: var(--red); }
  .fineprint { font-size: 12px; color: var(--grey); line-height: 1.5; }

  /* ---------- tabs ---------- */
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex;
    background: var(--black); border-top: 1px solid var(--line-dark);
    padding: 9px 0 max(9px, env(safe-area-inset-bottom));
    max-width: 720px; margin: 0 auto;
  }
  .tab { flex: 1; background: none; border: 0; font-family: inherit; font-size: 11.5px; color: #7A7A82; cursor: pointer; padding: 4px 0; font-weight: 500; }
  .tab[aria-current="true"] { color: var(--white); font-weight: 700; }
  .tab[aria-current="true"] .glyph { color: var(--red); }
  .tab .glyph { display: block; font-size: 18px; line-height: 1.35; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px;
    background: var(--black); color: var(--white); padding: 11px 17px; border-radius: 999px;
    font-size: 13.5px; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .18s;
    max-width: 86%; text-align: center; border: 1px solid var(--line-dark);
  }
  .toast.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="root"><div class="boot">Starting up…</div></div>

<script>
(function () {
  "use strict";

  /* ================================================================
     CONFIG — the only part you need to edit.
     Paste your Firebase web config here. Leave projectId empty to run
     in device mode (no login, data saved in this browser only).
     ================================================================ */
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyCkmsdfQQMI_YG0iDS6Lg_kMKIu_t6txaA",
    authDomain: "ags-crm-7d26a.firebaseapp.com",
    projectId: "ags-crm-7d26a",
    storageBucket: "ags-crm-7d26a.firebasestorage.app",
    messagingSenderId: "1061018089974",
    appId: "1:1061018089974:web:42f671f5100aff72b9efd7"
  };

  /* ================================================================ */

  var state = {
    ready: false,
    uid: null,
    profile: null,        // { name, goalDeals, goalValue }
    leads: [],            // my leads only — never leaves my account
    members: [],          // [{ uid, name, goalDeals, goalValue }]
    teamStats: {},        // uid -> aggregated numbers, no client details
    view: "boot",
    pickError: "", adding: false, editList: false, adding: false,
    filter: "all", q: "", current: null, editing: null, focusUid: null,
    lastRefresh: 0
  };

  // AGS Health plans, grouped the way they are on agshealth.co.za.
  var PRODUCT_GROUPS = [
    ["Combination", ["Green Combination", "Blue Combination", "Red Combination", "Compact Combination"]],
    ["Day-to-Day", ["Green Day-to-Day", "Blue Day-to-Day", "Red Day-to-Day"]],
    ["Dental", ["Bronze Dental", "Silver Dental", "Gold Dental"]],
    ["Accident and illness", ["Accident, Illness and Operation", "Accidental", "Illness and Operations"]],
    ["Other", ["Not decided yet", "Other"]]
  ];

  // Starting suggestions only. Reps type their own approach and it gets added
  // to the suggestion list for next time.
  var APPROACH_SUGGESTIONS = [
    "Needs analysis first", "Showed the numbers", "Compared to their medical aid",
    "Focused on the dental benefit", "Leaned on the referral", "Waiting periods explained",
    "Family cover angle", "Straight product pitch"
  ];
  var CHANNELS = ["Phone call", "WhatsApp", "In person", "Video call", "Email", "SMS"];
  var LOSS = ["Too expensive", "Not the right time", "No budget", "Went with a competitor", "Couldn't reach them", "Spouse / partner said no", "Happy with current cover", "Not qualified", "Went quiet", "Other"];
  var OBJECTIONS = ["Price", "Trust in me / the firm", "Needed to think", "Partner had to agree", "Already covered", "No real objection"];

  /* ---------- tiny helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function today() { return new Date().toISOString().slice(0, 10); }
  function thisMonth() { return today().slice(0, 7); }
  function monthName() { return new Date().toLocaleDateString("en-ZA", { month: "long" }); }
  function fmtDate(d) {
    if (!d) return "—";
    var p = String(d).split("-");
    var m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return Number(p[2]) + " " + m[Number(p[1]) - 1] + " " + p[0];
  }
  function daysBetween(a, b) { if (!a || !b) return null; return Math.round((new Date(b) - new Date(a)) / 86400000); }
  function money(n) { if (!n && n !== 0) return "—"; return "R" + Number(n).toLocaleString("en-ZA", { maximumFractionDigits: 0 }); }
  function lastTouch(c) {
    if (!c.contacts || !c.contacts.length) return c.firstContact;
    return c.contacts.map(function (x) { return x.date; }).sort().slice(-1)[0];
  }
  function opts(list, sel, blank) {
    var h = blank ? '<option value="">' + esc(blank) + "</option>" : "";
    return h + list.map(function (o) {
      return '<option value="' + esc(o) + '"' + (o === sel ? " selected" : "") + ">" + esc(o) + "</option>";
    }).join("");
  }
  function productOptions(sel) {
    var h = '<option value="">Pick a plan</option>';
    PRODUCT_GROUPS.forEach(function (g) {
      h += '<optgroup label="' + esc(g[0]) + '">';
      g[1].forEach(function (o) {
        h += '<option value="' + esc(o) + '"' + (o === sel ? " selected" : "") + ">" + esc(o) + "</option>";
      });
      h += "</optgroup>";
    });
    return h;
  }

  function approachList() {
    var seen = {};
    uniqueField("approach").forEach(function (v) { seen[v] = 1; });
    APPROACH_SUGGESTIONS.forEach(function (v) { seen[v] = 1; });
    return Object.keys(seen).sort();
  }

  function datalist(id, values) {
    return '<datalist id="' + id + '">' + values.map(function (v) { return '<option value="' + esc(v) + '">'; }).join("") + "</datalist>";
  }
  function uniqueField(field) {
    var seen = {};
    state.leads.forEach(function (c) { if (c[field]) seen[c[field]] = 1; });
    return Object.keys(seen).sort();
  }
  function byId(id) { return state.leads.filter(function (c) { return c.id === id; })[0]; }
  function memberName(uid) {
    var m = state.members.filter(function (x) { return x.uid === uid; })[0];
    return m ? m.name : "Unknown";
  }
  var toastTimer;
  function toast(msg) {
    var el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

  /* ================================================================
     DATA LAYER

     cloud mode (Firebase config present):
       leads/{uid}    full client records. Rules: only that account reads it.
       members/{uid}  display name and monthly target. Everyone reads.
       stats/{uid}    counts and rates only, no client details. Everyone reads.

     device mode (no config): everything in localStorage, single user.
     ================================================================ */

  var DB = { mode: "device", note: "", fs: null, store: null, auth: null, authApi: null };

  DB.init = function () {
    if (!FIREBASE_CONFIG.projectId) {
      DB.note = "No database connected — everything is saved in this browser only, and nobody else can see it. Add your Firebase config to index.html to share it with the team.";
      return Promise.resolve();
    }
    var base = "https://www.gstatic.com/firebasejs/10.12.2/";
    return Promise.all([
      import(base + "firebase-app.js"),
      import(base + "firebase-firestore.js"),
      import(base + "firebase-auth.js")
    ]).then(function (m) {
      var app = m[0].initializeApp(FIREBASE_CONFIG);
      DB.fs = m[1];
      DB.store = m[1].getFirestore(app);
      DB.authApi = m[2];
      DB.auth = m[2].getAuth(app);
      // No per-person accounts. An anonymous token is still required so the
      // database is not open to the raw internet.
      return m[2].signInAnonymously(DB.auth).then(function () { DB.mode = "cloud"; });
    }).catch(function (err) {
      DB.mode = "device";
      DB.note = "Couldn't reach the login service, so this is saving to your browser only. " +
        (err && err.message ? err.message : "");
      console.error("Firebase init failed:", err);
    });
  };

  function localGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function localRoster() { return localGet("ags:roster") || []; }
  function localRosterAdd(id) {
    var r = localRoster();
    if (r.indexOf(id) === -1) { r.push(id); localSet("ags:roster", r); }
  }
  function localSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast("This browser is blocking storage"); } }

  function docGet(coll, id) {
    if (DB.mode !== "cloud") return Promise.resolve(localGet(coll + ":" + id));
    return DB.fs.getDoc(DB.fs.doc(DB.store, coll, id)).then(function (snap) {
      if (!snap.exists()) return null;
      var d = snap.data();
      return d.json ? JSON.parse(d.json) : d;
    });
  }
  function docSet(coll, id, val) {
    if (DB.mode !== "cloud") {
      localSet(coll + ":" + id, val);
      if (coll === "members") localRosterAdd(id);
      return Promise.resolve();
    }
    localSet(coll + ":" + id, val);
    var payload;
    if (coll === "members") {
      // Only ever these three fields. No email, no phone — this doc is readable
      // by the whole team, and the rules reject anything else anyway.
      payload = {
        name: String(val.name || "").replace(/@/g, " ").slice(0, 60),
        goalDeals: val.goalDeals || "",
        goalValue: val.goalValue || "",
        updated: new Date().toISOString()
      };
    } else {
      payload = { json: JSON.stringify(val), updated: new Date().toISOString() };
    }
    return DB.fs.setDoc(DB.fs.doc(DB.store, coll, id), payload);
  }
  function docDelete(coll, id) {
    if (DB.mode !== "cloud") {
      try { localStorage.removeItem(coll + ":" + id); } catch (e) {}
      if (coll === "members") {
        localSet("ags:roster", localRoster().filter(function (x) { return x !== id; }));
      }
      return Promise.resolve();
    }
    return DB.fs.deleteDoc(DB.fs.doc(DB.store, coll, id));
  }

  function removeMember(uid) {
    var m = state.members.filter(function (x) { return x.uid === uid; })[0];
    var st = state.teamStats[uid] || blankStats();
    var warn = st.total
      ? "Remove " + (m ? m.name : "this person") + "? Their " + st.total +
        " lead" + (st.total === 1 ? "" : "s") + " will be deleted permanently."
      : "Remove " + (m ? m.name : "this person") + " from the list?";
    if (!confirm(warn)) return;

    Promise.all([
      docDelete("leads", uid),
      docDelete("stats", uid),
      docDelete("members", uid)
    ]).then(function () {
      state.members = state.members.filter(function (x) { return x.uid !== uid; });
      delete state.teamStats[uid];
      if (localGet("ags:lastUser") === uid) localSet("ags:lastUser", null);
      render();
      toast("Removed");
    }).catch(function (err) {
      console.error("Delete failed:", err);
      toast("Couldn't remove that — check the Firestore rules allow delete");
    });
  }

  function collGet(coll) {
    if (DB.mode !== "cloud") {
      var out = [];
      localRoster().forEach(function (id) {
        var d = localGet(coll + ":" + id);
        if (d) out.push({ id: id, data: d });
      });
      return Promise.resolve(out);
    }
    return DB.fs.getDocs(DB.fs.collection(DB.store, coll)).then(function (snap) {
      var out = [];
      snap.forEach(function (d) {
        var v = d.data();
        out.push({ id: d.id, data: v.json ? JSON.parse(v.json) : v });
      });
      return out;
    });
  }

  /* ---------- stats ---------- */
  function stats(list) {
    var w = 0, l = 0, o = 0, wonValue = 0, openValue = 0, dSum = 0, dN = 0, tW = 0, tWN = 0, tL = 0, tLN = 0;
    list.forEach(function (c) {
      var t = (c.contacts || []).length;
      if (c.status === "won") {
        w++; wonValue += Number(c.value) || 0;
        var d = daysBetween(c.firstContact, c.closedDate);
        if (d !== null && d >= 0) { dSum += d; dN++; }
        tW += t; tWN++;
      } else if (c.status === "lost") { l++; tL += t; tLN++; }
      else { o++; openValue += Number(c.value) || 0; }
    });
    var closed = w + l;
    return {
      won: w, lost: l, open: o, closed: closed, total: list.length,
      rate: closed ? (w / closed) * 100 : null,
      wonValue: wonValue, openValue: openValue,
      avgDays: dN ? Math.round(dSum / dN) : null,
      avgTouchWon: tWN ? tW / tWN : null,
      avgTouchLost: tLN ? tL / tLN : null
    };
  }
  function monthStats(list) {
    var m = thisMonth(), deals = 0, value = 0, newLeads = 0;
    list.forEach(function (c) {
      if (c.status === "won" && c.closedDate && c.closedDate.slice(0, 7) === m) { deals++; value += Number(c.value) || 0; }
      if (c.firstContact && c.firstContact.slice(0, 7) === m) newLeads++;
    });
    return { deals: deals, value: value, newLeads: newLeads };
  }
  function breakdown(list, field) {
    var m = {};
    list.forEach(function (c) {
      if (c.status === "open") return;
      var k = c[field] || "Not recorded";
      if (!m[k]) m[k] = { won: 0, closed: 0 };
      m[k].closed++;
      if (c.status === "won") m[k].won++;
    });
    return Object.keys(m).map(function (k) {
      return { key: k, won: m[k].won, closed: m[k].closed, rate: (m[k].won / m[k].closed) * 100 };
    }).sort(function (a, b) { return b.rate - a.rate || b.closed - a.closed; });
  }
  function tally(list, field, status) {
    var m = {};
    list.forEach(function (c) {
      if (c.status !== status) return;
      var k = (c.close && c.close[field]) || c[field] || "Not recorded";
      m[k] = (m[k] || 0) + 1;
    });
    return Object.keys(m).map(function (k) { return { key: k, n: m[k] }; }).sort(function (a, b) { return b.n - a.n; });
  }

  // What gets shared with the team. Deliberately excludes names, phones,
  // emails, notes, and the free-text "how you got them" field — that one is
  // free text and reps type client names into it.
  function shareableStats(list) {
    var s = stats(list);
    return {
      total: s.total, won: s.won, lost: s.lost, open: s.open, closed: s.closed,
      rate: s.rate, wonValue: s.wonValue, openValue: s.openValue,
      avgDays: s.avgDays, avgTouchWon: s.avgTouchWon, avgTouchLost: s.avgTouchLost,
      month: monthStats(list),
      adverts: breakdown(list, "advert"),
      approaches: breakdown(list, "approach"),
      products: breakdown(list, "product"),
      channels: tally(list, "channel", "won"),
      losses: tally(list, "reason", "lost"),
      updated: new Date().toISOString()
    };
  }
  function blankStats() {
    return { total: 0, won: 0, lost: 0, open: 0, closed: 0, rate: null, wonValue: 0, openValue: 0,
      avgDays: null, avgTouchWon: null, avgTouchLost: null,
      month: { deals: 0, value: 0, newLeads: 0 },
      adverts: [], approaches: [], products: [], channels: [], losses: [] };
  }
  function mergeBreakdowns(arrays) {
    var m = {};
    arrays.forEach(function (arr) {
      (arr || []).forEach(function (r) {
        if (!m[r.key]) m[r.key] = { won: 0, closed: 0 };
        m[r.key].won += r.won; m[r.key].closed += r.closed;
      });
    });
    return Object.keys(m).map(function (k) {
      return { key: k, won: m[k].won, closed: m[k].closed, rate: (m[k].won / m[k].closed) * 100 };
    }).sort(function (a, b) { return b.rate - a.rate || b.closed - a.closed; });
  }
  function mergeTallies(arrays) {
    var m = {};
    arrays.forEach(function (arr) { (arr || []).forEach(function (r) { m[r.key] = (m[r.key] || 0) + r.n; }); });
    return Object.keys(m).map(function (k) { return { key: k, n: m[k] }; }).sort(function (a, b) { return b.n - a.n; });
  }
  function companyStats() {
    var all = state.members.map(function (m) { return state.teamStats[m.uid] || blankStats(); });
    var out = blankStats();
    var dSum = 0, dN = 0, twSum = 0, twN = 0, tlSum = 0, tlN = 0;
    all.forEach(function (s) {
      out.total += s.total; out.won += s.won; out.lost += s.lost; out.open += s.open;
      out.wonValue += s.wonValue; out.openValue += s.openValue;
      out.month.deals += s.month.deals; out.month.value += s.month.value; out.month.newLeads += s.month.newLeads;
      if (s.avgDays !== null && s.won) { dSum += s.avgDays * s.won; dN += s.won; }
      if (s.avgTouchWon !== null && s.won) { twSum += s.avgTouchWon * s.won; twN += s.won; }
      if (s.avgTouchLost !== null && s.lost) { tlSum += s.avgTouchLost * s.lost; tlN += s.lost; }
    });
    out.closed = out.won + out.lost;
    out.rate = out.closed ? (out.won / out.closed) * 100 : null;
    out.avgDays = dN ? Math.round(dSum / dN) : null;
    out.avgTouchWon = twN ? twSum / twN : null;
    out.avgTouchLost = tlN ? tlSum / tlN : null;
    out.adverts = mergeBreakdowns(all.map(function (s) { return s.adverts; }));
    out.approaches = mergeBreakdowns(all.map(function (s) { return s.approaches; }));
    out.products = mergeBreakdowns(all.map(function (s) { return s.products; }));
    out.channels = mergeTallies(all.map(function (s) { return s.channels; }));
    out.losses = mergeTallies(all.map(function (s) { return s.losses; }));
    return out;
  }

  /* ---------- saving ---------- */
  function saveLeads() {
    return docSet("leads", state.uid, state.leads)
      .then(function () { return docSet("stats", state.uid, shareableStats(state.leads)); })
      .then(function () { state.teamStats[state.uid] = shareableStats(state.leads); })
      .catch(function (err) {
        console.error("Save failed:", err);
        toast("Saved on this device but not to the server");
      });
  }
  function saveProfile() {
    return docSet("members", state.uid, state.profile).catch(function (err) {
      console.error("Profile save failed:", err);
      toast("Couldn't save that");
    });
  }

  /* ================================================================
     AUTH
     ================================================================ */
  function newMemberId() {
    return "m" + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
  }

  function openAs(uid) {
    state.uid = uid;
    localSet("ags:lastUser", uid);
    state.view = "boot"; render();
    Promise.all([docGet("members", uid), docGet("leads", uid)]).then(function (r) {
      var m = state.members.filter(function (x) { return x.uid === uid; })[0];
      state.profile = r[0] || { name: m ? m.name : "Unnamed", goalDeals: "", goalValue: "" };
      state.leads = r[1] || [];
      go("team");
    }).catch(function (err) {
      console.error("Load failed:", err);
      toast("Couldn't load that profile");
      go("pick");
    });
  }

  function addMember(name) {
    if (!name) { state.pickError = "Type a name first."; render(); return; }
    if (name.indexOf("@") > -1) { state.pickError = "Use a name, not an email address."; render(); return; }
    var clash = state.members.filter(function (m) {
      return m.name.toLowerCase() === name.toLowerCase();
    })[0];
    if (clash) { state.pickError = "Someone is already using that name. Add a surname or initial."; render(); return; }

    var uid = newMemberId();
    var profile = { name: name, goalDeals: "", goalValue: "" };
    state.pickError = "";
    docSet("members", uid, profile).then(function () {
      state.members.push({ uid: uid, name: name, goalDeals: "", goalValue: "" });
      state.teamStats[uid] = blankStats();
      state.adding = false;
      return docSet("stats", uid, shareableStats([]));
    }).then(function () {
      openAs(uid);
      toast("Welcome, " + name.split(" ")[0]);
    }).catch(function (err) {
      console.error("Couldn't add member:", err);
      state.pickError = "Couldn't save that. Check your connection.";
      render();
    });
  }

  function loadRoster() {
    return Promise.all([collGet("members"), collGet("stats")]).then(function (r) {
      state.members = (r[0] || []).map(function (d) {
        return { uid: d.id, name: d.data.name || "Unnamed", goalDeals: d.data.goalDeals || "", goalValue: d.data.goalValue || "" };
      }).sort(function (a, b) { return a.name.localeCompare(b.name); });
      state.teamStats = {};
      (r[1] || []).forEach(function (d) { state.teamStats[d.id] = d.data; });
    });
  }

  function switchUser() {
    state.uid = null; state.leads = []; state.profile = null;
    state.pickError = ""; state.adding = false;
    localSet("ags:lastUser", null);
    state.view = "boot"; render();
    loadRoster().then(function () { go("pick"); }).catch(function () { go("pick"); });
  }

  function refreshTeam() {
    var now = Date.now();
    if (now - state.lastRefresh < 15000) { toast("Just a moment — try again in a few seconds"); return; }
    state.lastRefresh = now;
    toast("Refreshing…");
    Promise.all([collGet("members"), collGet("stats")]).then(function (r) {
      state.members = (r[0] || []).map(function (d) {
        return { uid: d.id, name: d.data.name || "Unnamed", goalDeals: d.data.goalDeals || "", goalValue: d.data.goalValue || "" };
      });
      state.teamStats = {};
      (r[1] || []).forEach(function (d) { state.teamStats[d.id] = d.data; });
      render(); toast("Up to date");
    }).catch(function (err) { console.error(err); toast("Couldn't refresh"); });
  }

  /* ================================================================
     VIEWS
     ================================================================ */
  function initials(name) {
    var parts = String(name).trim().split(/\s+/);
    var a = parts[0] ? parts[0][0] : "?";
    var b = parts.length > 1 ? parts[parts.length - 1][0] : "";
    return (a + b).toUpperCase();
  }

  function viewPick() {

    h += "<h1>Who's<br>working<em>?</em></h1>";

    h += '<div class="who-list">';
    state.members.forEach(function (m) {
      var st = state.teamStats[m.uid] || blankStats();
      if (state.editList) {
        h += '<div class="who-btn"><span class="av">' + esc(initials(m.name)) + "</span>" +
          '<span><span class="nm">' + esc(m.name) + "</span>" +

      } else {
        h += '<button class="who-btn" data-openas="' + esc(m.uid) + '">' +

    } else {
      h += '<button class="add-btn" data-startadd="1"><span class="av">+</span>Add new</button>';

  }

  function brandbar() {
    var h = '<div class="brandbar"><span class="mark">AGS<i>.</i></span>' +
      '<span class="who">' + esc(state.profile ? state.profile.name : "") +
      ' · <button data-switch="1">Switch</button></span></div>';
    if (DB.mode !== "cloud") h += '<div class="notice">' + esc(DB.note) + "</div>";
    return h;
  }

  function rateHero(s, caption) {
    var tot = Math.max(1, s.won + s.lost + s.open);
    return '<div class="rate"><div class="fig">' + (s.rate === null ? "—" : Math.round(s.rate)) +
      (s.rate === null ? "" : '<span class="pct">%</span>') + "</div>" +
      '<div class="cap">' + esc(caption || (s.closed ? s.won + " closed out of " + s.closed + " decided" : "No deals decided yet")) + "</div>" +
      '<div class="streak"><i class="w" style="width:' + (s.won / tot * 100) + '%"></i>' +
      '<i class="l" style="width:' + (s.lost / tot * 100) + '%"></i>' +
      '<i class="o" style="width:' + (s.open / tot * 100) + '%"></i></div>' +
      '<div class="legend"><span><i class="dot w"></i>Won <b>' + s.won + "</b></span>" +
      '<span><i class="dot l"></i>Lost <b>' + s.lost + "</b></span>" +
      '<span><i class="dot o"></i>Open <b>' + s.open + "</b></span>" +
      "<span>Signed <b>" + money(s.wonValue) + "</b></span></div></div>";
  }

  function goalStrip(name, goalDeals, goalValue, ms, editable) {
    var gd = Number(goalDeals) || 0, gv = Number(goalValue) || 0;
    var pct = gd ? Math.min(100, (ms.deals / gd) * 100) : 0;
    var h = '<div class="goal">';
    h += '<div class="lab"><span>' + esc(monthName()) + " target</span><b>" + ms.deals + (gd ? " of " + gd : "") + " deals</b></div>";
    h += '<div class="track"><div class="fill' + (gd && ms.deals >= gd ? " hit" : "") + '" style="width:' + Math.max(gd ? 2 : 0, pct) + '%"></div></div>';
    h += '<div class="foot">' + money(ms.value) + (gv ? " of " + money(gv) : "") + " signed · " + ms.newLeads + " new leads this month";
    if (editable) h += ' · <button data-goal="1">' + (gd ? "Change target" : "Set a target") + "</button>";
    h += "</div></div>";
    return h;
  }

  function statRows(s) {
    return '<div class="stat"><span class="k">Conversion rate<small>Won ÷ deals that reached a decision</small></span><span class="v">' + (s.rate === null ? "—" : Math.round(s.rate) + "%") + "</span></div>" +
      '<div class="stat"><span class="k">Average days to close</span><span class="v">' + (s.avgDays === null ? "—" : s.avgDays) + "</span></div>" +
      '<div class="stat"><span class="k">Touches before a yes</span><span class="v">' + (s.avgTouchWon == null ? "—" : s.avgTouchWon.toFixed(1)) + "</span></div>" +
      '<div class="stat"><span class="k">Touches before a no</span><span class="v">' + (s.avgTouchLost == null ? "—" : s.avgTouchLost.toFixed(1)) + "</span></div>" +
      '<div class="stat"><span class="k">Signed value</span><span class="v">' + money(s.wonValue) + "</span></div>" +
      '<div class="stat"><span class="k">Still on the table</span><span class="v">' + money(s.openValue) + "</span></div>";
  }

  function meter(rows, max) {
    if (!rows || !rows.length) return '<p class="hint">Nothing closed yet.</p>';
    return rows.slice(0, max || 8).map(function (r) {
      return '<div class="meter' + (r.rate < 34 ? " neg" : "") + '"><div class="lab"><span>' + esc(r.key) +
        "</span><em>" + Math.round(r.rate) + "% · " + r.won + "/" + r.closed + "</em></div>" +
        '<div class="track"><div class="fill" style="width:' + Math.max(2, r.rate) + '%"></div></div></div>';
    }).join("");
  }
  function tallyBlock(title, hint, rows) {
    if (!rows || !rows.length) return "";
    var h = '<div class="block"><h2>' + esc(title) + '</h2><p class="hint">' + esc(hint) + "</p>";
    rows.forEach(function (r) { h += '<div class="stat"><span class="k">' + esc(r.key) + '</span><span class="v">' + r.n + "</span></div>"; });
    return h + "</div>";
  }
  function breakdownBlocks(s, includeSource) {
    var h = "";
    h += '<div class="block"><h2>Advertisement</h2><p class="hint">Which advert brings people who actually sign.</p>' + meter(s.adverts) + "</div>";
    if (includeSource) h += '<div class="block"><h2>How they were found</h2><p class="hint">Only you see this one — it\'s free text and often has names in it.</p>' + meter(includeSource) + "</div>";
    h += '<div class="block"><h2>Approach</h2><p class="hint">The angle opened with, ranked by close rate.</p>' + meter(s.approaches) + "</div>";
    h += '<div class="block"><h2>Plan</h2><p class="hint">Which plans you actually close.</p>' + meter(s.products) + "</div>";
    h += tallyBlock("How the yes came in", "Channel the deal was closed on.", s.channels);
    h += tallyBlock("Why deals died", "Most common loss reasons.", s.losses);
    return h;
  }

  function leadRow(c) {
    var k = c.status === "won" ? "w" : c.status === "lost" ? "l" : "o";
    var d = daysBetween(lastTouch(c), today());
    var meta;
    if (c.status === "won") meta = "Closed " + fmtDate(c.closedDate);
    else if (c.status === "lost") meta = (c.close && c.close.reason) || "Lost";
    else meta = d === null ? "No contact logged" : d === 0 ? "Spoken to today" : d + (d === 1 ? " day" : " days") + " since contact";
    return '<button class="row" data-open="' + esc(c.id) + '">' +
      '<span class="bar ' + k + '"></span>' +
      '<span><span class="nm">' + esc(c.name) + "</span>" +
      '<span class="meta' + (c.status === "open" && d >= 7 ? " stale" : "") + '">' +
      (c.advert ? esc(c.advert) + " · " : "") + esc(meta) + "</span></span>" +
      '<span class="val">' + money(c.value) + "</span></button>";
  }

  function viewPipeline() {
    var s = stats(state.leads);
    var h = brandbar();
    h += '<div class="topline"><h1>My pipeline</h1><div class="sub">' + s.total + (s.total === 1 ? " lead" : " leads") + "</div></div>";
    h += rateHero(s);
    h += goalStrip(state.profile.name, state.profile.goalDeals, state.profile.goalValue, monthStats(state.leads), true);

    h += '<div class="filters">';
    [["all","Everyone"],["open","Open"],["won","Won"],["lost","Lost"],["stale","Needs a nudge"]].forEach(function (f) {
      h += '<button class="chip" data-filter="' + f[0] + '" aria-pressed="' + (state.filter === f[0]) + '">' + f[1] + "</button>";
    });
    h += "</div>";
    h += '<div class="searchwrap"><input class="search" id="q" placeholder="Search name, advert, plan or source" value="' + esc(state.q) + '"></div>';

    var list = state.leads.filter(function (c) {
      if (state.filter === "stale") {
        if (c.status !== "open") return false;
        var d = daysBetween(lastTouch(c), today());
        return d !== null && d >= 7;
      }
      if (state.filter !== "all" && c.status !== state.filter) return false;
      if (!state.q) return true;
      return [c.name, c.advert, c.product, c.source].join(" ").toLowerCase().indexOf(state.q.toLowerCase()) > -1;
    }).sort(function (a, b) {
      var rank = { open: 0, won: 1, lost: 2 };
      if (rank[a.status] !== rank[b.status]) return rank[a.status] - rank[b.status];
      return (lastTouch(b) || "") > (lastTouch(a) || "") ? 1 : -1;
    });

    if (!list.length) {
      h += '<div class="empty"><b>' + (state.leads.length ? "Nothing matches that" : "No leads logged yet") + "</b>" +
        (state.leads.length ? "Clear the search or pick another filter." : "Tap Add to log the first person you spoke to.") + "</div>";
    } else {
      h += '<div class="ledger">';
      list.forEach(function (c) { h += leadRow(c); });

    }
    return h;
  }

  /* ---------- render ---------- */
  function render() {
    var body, tabs = "";
    if (state.view === "boot") { document.getElementById("root").innerHTML = '<div class="boot">Loading…</div>'; return; }

    if (state.view === "pick") body = viewPick();
    else if (state.view === "pipeline") body = viewPipeline();
    else if (state.view === "insights") body = viewInsights();
    else if (state.view === "team") body = viewTeam();
    else if (state.view === "member") body = viewMember();
    else if (state.view === "detail") body = viewDetail();
    else if (state.view === "edit") body = viewForm();
    else if (state.view === "log") body = viewLog();
    else if (state.view === "close-won") body = viewClose(true);
    else if (state.view === "close-lost") body = viewClose(false);
    else if (state.view === "goal") body = viewGoal();

    if (state.view !== "pick") {
      tabs = '<nav class="tabbar">' +
        '<button class="tab" data-tab="pipeline" aria-current="' + (state.view === "pipeline") + '"><span class="glyph">▤</span>Pipeline</button>' +
        '<button class="tab" data-tab="new" aria-current="' + (state.view === "edit") + '"><span class="glyph">＋</span>Add</button>' +
        '<button class="tab" data-tab="insights" aria-current="' + (state.view === "insights") + '"><span class="glyph">◑</span>Mine</button>' +
        '<button class="tab" data-tab="team" aria-current="' + (state.view === "team" || state.view === "member") + '"><span class="glyph">◍</span>Team</button></nav>';
    }
    document.getElementById("root").innerHTML = '<div class="screen">' + body + "</div>" + tabs + '<div class="toast" id="toast"></div>';
  }
  function go(v) { state.view = v; render(); window.scrollTo(0, 0); }

  /* ---------- form handling (no <form> tags: they don't submit in some frames) ---------- */
  function submitForm(id) {
    var f = document.getElementById(id);
    if (!f) return;
    var val = function (i) { var el = document.getElementById(i); return el ? el.value.trim() : ""; };

    if (id === "joinform") {
      addMember(val("j-name"));
      return;
    }

    if (id === "goalform") {
      var newName = val("g-name");
      if (!newName) { toast("Your name can't be blank"); return; }
      if (newName.indexOf("@") > -1) { toast("Use your name, not an email address"); return; }
      state.profile.name = newName;
      state.profile.goalDeals = val("g-deals");
      state.profile.goalValue = val("g-value");
      var me = state.members.filter(function (m) { return m.uid === state.uid; })[0];
      if (me) { me.name = state.profile.name; me.goalDeals = state.profile.goalDeals; me.goalValue = state.profile.goalValue; }
      saveProfile().then(function () { go("pipeline"); toast("Saved"); });
      return;
    }

    if (id === "clientform") {
      if (!val("f-name")) { toast("Add a name first"); return; }
      var editing = state.editing;
      var rec = editing || { id: "l" + Date.now() + Math.floor(Math.random() * 999), status: "open", contacts: [] };
      rec.name = val("f-name"); rec.advert = val("f-advert"); rec.phone = val("f-phone");
      rec.email = val("f-email"); rec.source = val("f-source"); rec.product = val("f-product");
      rec.value = val("f-value"); rec.firstContact = val("f-first");
      rec.approach = val("f-approach"); rec.notes = val("f-notes");
      if (!editing) { state.leads.push(rec); state.current = rec.id; }
      state.editing = null;
      saveLeads().then(function () { go("detail"); toast(editing ? "Changes saved" : "Lead added"); });
      return;
    }

    if (id === "logform") {
      var c = byId(state.current);
      c.contacts = c.contacts || [];
      c.contacts.push({ date: val("l-date"), channel: val("l-channel"), note: val("l-note") });
      saveLeads().then(function () { go("detail"); toast("Contact logged"); });
      return;
    }

    if (id === "closeform") {
      var won = f.dataset.won === "1";
      var cl = byId(state.current);
      cl.closedDate = val("c-date");
      if (won) {
        cl.value = val("c-value");
        cl.close = { channel: val("c-channel"), sealed: val("c-sealed"), objection: val("c-objection"), detail: val("c-detail") };
      } else {
        if (!val("c-reason")) { toast("Pick a reason"); return; }
        cl.close = { reason: val("c-reason"), detail: val("c-detail") };
      }
      cl.status = won ? "won" : "lost";
      saveLeads().then(function () { go("detail"); toast(won ? "Marked won" : "Marked lost"); });
      return;
    }
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-submit],[data-editlist],[data-removemember],[data-startadd],[data-addmember],[data-shownew],[data-canceladd],[data-openas],[data-switch],[data-refresh],[data-tab],[data-open],[data-go],[data-filter],[data-member],[data-goal],[data-reopen],[data-delete],#export");
    if (!t) return;

    if (t.dataset.submit) { submitForm(t.dataset.submit); return; }
    if (t.dataset.editlist) { state.editList = !state.editList; state.adding = false; render(); return; }
    if (t.dataset.removemember) { removeMember(t.dataset.removemember); return; }
    if (t.dataset.startadd) { state.adding = true; state.pickError = ""; render(); return; }
    if (t.dataset.addmember) { submitForm("joinform"); return; }
    if (t.dataset.shownew) { state.adding = true; state.pickError = ""; render(); return; }
    if (t.dataset.canceladd) { state.adding = false; state.pickError = ""; render(); return; }
    if (t.dataset.openas) { openAs(t.dataset.openas); return; }
    if (t.dataset.switch) { switchUser(); return; }
    if (t.dataset.refresh) { refreshTeam(); return; }
    if (t.dataset.tab) {
      if (t.dataset.tab === "new") { state.editing = null; go("edit"); }
      else go(t.dataset.tab);
      return;
    }
    if (t.dataset.member) { state.focusUid = t.dataset.member; go("member"); return; }
    if (t.dataset.goal) { go("goal"); return; }
    if (t.dataset.open) { state.current = t.dataset.open; go("detail"); return; }
    if (t.dataset.go) {
      if (t.dataset.go === "edit") state.editing = byId(state.current);
      go(t.dataset.go);
      return;
    }
    if (t.dataset.filter) { state.filter = t.dataset.filter; render(); return; }
    if (t.dataset.reopen) {
      var c = byId(state.current);
      c.status = "open"; c.closedDate = null; c.close = null;
      saveLeads().then(function () { render(); toast("Back in the pipeline"); });
      return;
    }
    if (t.dataset.delete) {
      if (!confirm("Delete this lead and their history? This can't be undone.")) return;
      state.leads = state.leads.filter(function (x) { return x.id !== state.current; });
      saveLeads().then(function () { go("pipeline"); toast("Lead deleted"); });
      return;
    }
    if (t.id === "export") { exportCsv(); return; }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "q") {
      state.q = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var el = document.getElementById("q");
      if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (!e.target.matches || !e.target.matches("input")) return;
    var wrap = e.target.closest(".formwrap");
    if (!wrap) return;
    e.preventDefault();
    submitForm(wrap.id);
  });

  function exportCsv() {
    var cols = ["Name","Advertisement","Phone","Email","How they were found","Product","Value","Approach","First contact","Status","Closed","Days to close","Touches","Close channel","What sealed it","Objection","Loss reason","Detail","Notes"];
    var rows = state.leads.map(function (c) {
      var cl = c.close || {};
      return [c.name, c.advert, c.phone, c.email, c.source, c.product, c.value, c.approach,
        c.firstContact, c.status, c.closedDate || "",
        c.status === "won" ? (daysBetween(c.firstContact, c.closedDate) || "") : "",
        (c.contacts || []).length, cl.channel || "", cl.sealed || "", cl.objection || "",
        cl.reason || "", cl.detail || "", c.notes || ""];
    });
    var csv = [cols].concat(rows).map(function (r) {
      return r.map(function (x) { return '"' + String(x == null ? "" : x).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "my-leads-" + today() + ".csv";
    a.click();
    toast("CSV downloaded — it has client details in it, keep it safe");
  }

  /* ---------- boot ---------- */
  DB.init().then(function () {
    return loadRoster();
  }).then(function () {
    var last = localGet("ags:lastUser");
    if (last && state.members.some(function (m) { return m.uid === last; })) openAs(last);
    else go("pick");
  }).catch(function (err) {
    console.error("Startup failed:", err);
    DB.note = DB.note || "Couldn't reach the database. Working from this browser only.";
    go("pick");
  });
})();
