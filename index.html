<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF7">
<meta name="robots" content="noindex, nofollow">
<title>AGS Consult — Pipeline</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; background: #FBFAF7; }

  :root {
    --canvas: #FBFAF7;
    --surface: #FFFFFF;
    --ink: #16202B;
    --ink-soft: #5C6B7A;
    --ink-faint: #93A1AD;
    --rule: #E4E0D7;
    --won: #2F5D50;
    --won-tint: #E8F0ED;
    --lost: #A4442E;
    --lost-tint: #F7EAE6;
    --open: #B57614;
    --open-tint: #FBF0DC;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  #root {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink); background: var(--canvas); min-height: 100vh;
    padding-bottom: 84px; font-size: 15px; line-height: 1.45;
    max-width: 720px; margin: 0 auto;
  }
  .boot { padding: 48px 20px; color: var(--ink-faint); }
  .pad { padding: 0 18px; }

  .brandbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 10px; border-bottom: 1px solid var(--rule);
  }
  .brandbar .mark { font-size: 13px; font-weight: 640; letter-spacing: 0.02em; }
  .brandbar .who { font-size: 13px; color: var(--ink-soft); }
  .brandbar button {
    background: none; border: 0; font-family: inherit; font-size: 13px;
    color: var(--ink-soft); cursor: pointer; padding: 4px 0; text-decoration: underline;
  }
  .notice {
    padding: 9px 18px; background: var(--open-tint); color: #7A4E0B;
    font-size: 12.5px; border-bottom: 1px solid var(--rule);
  }

  .topline { display: flex; align-items: baseline; justify-content: space-between; padding: 20px 18px 12px; }
  .topline h1 { font-size: 19px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .topline .sub { font-size: 13px; color: var(--ink-faint); }

  .rate { padding: 4px 18px 20px; border-bottom: 1px solid var(--rule); }
  .rate .fig {
    font-size: 62px; line-height: 0.9; font-weight: 640; letter-spacing: -0.045em;
    font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 4px;
  }
  .rate .fig span.pct { font-size: 26px; font-weight: 500; color: var(--ink-soft); letter-spacing: -0.02em; }
  .rate .cap { margin-top: 8px; font-size: 13.5px; color: var(--ink-soft); }

  .streak { display: flex; height: 8px; margin-top: 16px; border-radius: 999px; overflow: hidden; background: var(--rule); }
  .streak i { display: block; height: 100%; }
  .streak i.w { background: var(--won); } .streak i.l { background: var(--lost); } .streak i.o { background: var(--open); }
  .legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12.5px; color: var(--ink-soft); flex-wrap: wrap; }
  .legend b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }
  .dot.w { background: var(--won); } .dot.l { background: var(--lost); } .dot.o { background: var(--open); }

  .goal { padding: 16px 18px; border-bottom: 1px solid var(--rule); }
  .goal .lab { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; margin-bottom: 7px; }
  .goal .lab span { color: var(--ink-soft); }
  .goal .lab b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .goal .track { height: 9px; background: var(--rule); border-radius: 999px; overflow: hidden; }
  .goal .fill { height: 100%; background: var(--ink); border-radius: 999px; }
  .goal .fill.hit { background: var(--won); }
  .goal .foot { margin-top: 8px; font-size: 12.5px; color: var(--ink-faint); }
  .goal .foot button { background: none; border: 0; font-family: inherit; font-size: 12.5px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; padding: 0; }

  .filters { display: flex; gap: 7px; padding: 14px 18px 10px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink-soft);
    padding: 6px 13px; border-radius: 999px; font-size: 13.5px; white-space: nowrap;
    cursor: pointer; font-family: inherit;
  }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  .searchwrap { padding: 2px 18px 8px; }
  input.search {
    width: 100%; border: 1px solid var(--rule); background: var(--surface);
    padding: 10px 12px; border-radius: 10px; font-size: 16px; font-family: inherit; color: var(--ink);
  }

  .ledger { border-top: 1px solid var(--rule); margin-top: 6px; }
  .row {
    display: grid; grid-template-columns: 3px 1fr auto; gap: 12px; align-items: center;
    padding: 13px 18px; border-bottom: 1px solid var(--rule); background: none;
    border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left;
    font-family: inherit; cursor: pointer;
  }
  .row:active { background: #F3F1EC; }
  .bar { width: 3px; height: 34px; border-radius: 2px; }
  .bar.w { background: var(--won); } .bar.l { background: var(--lost); } .bar.o { background: var(--open); }
  .row .nm { font-size: 15.5px; font-weight: 570; color: var(--ink); }
  .row .meta { font-size: 12.5px; color: var(--ink-faint); margin-top: 2px; }
  .row .val { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--ink-soft); text-align: right; }
  .row .val small { display: block; font-size: 11.5px; color: var(--ink-faint); }
  .row .stale { color: var(--lost); }

  .empty { padding: 44px 18px; color: var(--ink-soft); font-size: 14.5px; }
  .empty b { display: block; color: var(--ink); font-size: 16px; font-weight: 600; margin-bottom: 6px; }

  .block { padding: 20px 18px; border-bottom: 1px solid var(--rule); }
  .block h2 { font-size: 14px; font-weight: 620; margin: 0 0 4px; }
  .block p.hint { font-size: 12.5px; color: var(--ink-faint); margin: 0 0 14px; }

  .stat { display: flex; align-items: baseline; justify-content: space-between; padding: 9px 0; gap: 14px; }
  .stat + .stat { border-top: 1px solid var(--rule); }
  .stat .k { font-size: 14.5px; }
  .stat .k small { display: block; color: var(--ink-faint); font-size: 12px; }
  .stat .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .meter { margin: 11px 0 0; }
  .meter .lab { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 5px; gap: 12px; }
  .meter .lab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meter .lab em { font-style: normal; color: var(--ink-faint); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter .track { height: 7px; background: var(--rule); border-radius: 999px; overflow: hidden; }
  .meter .fill { height: 100%; background: var(--won); border-radius: 999px; }
  .meter.neg .fill { background: var(--lost); }

  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 5px; font-weight: 520; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
    padding: 11px 12px; border-radius: 10px; font-size: 16px; font-family: inherit;
  }
  .field textarea { min-height: 76px; resize: vertical; line-height: 1.5; }
  .field .note { font-size: 12px; color: var(--ink-faint); margin-top: 5px; }
  .field input:focus, .field select:focus, .field textarea:focus, input.search:focus {
    outline: 2px solid var(--ink); outline-offset: 1px; border-color: transparent;
  }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  button.btn {
    width: 100%; padding: 14px; border-radius: 11px; border: 1px solid var(--ink);
    background: var(--ink); color: #fff; font-size: 15.5px; font-weight: 560;
    font-family: inherit; cursor: pointer; margin-top: 4px;
  }
  button.btn.ghost { background: var(--surface); color: var(--ink); }
  button.btn.won { background: var(--won); border-color: var(--won); }
  button.btn.lost { background: var(--lost); border-color: var(--lost); }
  button.btn.danger { background: none; border-color: var(--lost); color: var(--lost); }
  button.btn[disabled] { opacity: .5; cursor: default; }
  button.btn:focus-visible, .chip:focus-visible, .row:focus-visible, .tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .backbar { display: flex; align-items: center; gap: 10px; padding: 16px 18px 6px; }
  .backbar button { background: none; border: 0; font-family: inherit; font-size: 14.5px; color: var(--ink-soft); cursor: pointer; padding: 4px 0; }

  .dhead { padding: 4px 18px 16px; border-bottom: 1px solid var(--rule); }
  .dhead h2 { font-size: 24px; margin: 0 0 4px; font-weight: 640; letter-spacing: -0.02em; }
  .dhead .co { color: var(--ink-soft); font-size: 14.5px; }
  .tag { display: inline-block; margin-top: 10px; padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 570; }
  .tag.w { background: var(--won-tint); color: var(--won); }
  .tag.l { background: var(--lost-tint); color: var(--lost); }
  .tag.o { background: var(--open-tint); color: var(--open); }

  .kv { display: grid; grid-template-columns: 118px 1fr; gap: 4px 12px; padding: 16px 18px; border-bottom: 1px solid var(--rule); font-size: 14.5px; }
  .kv dt { color: var(--ink-faint); font-size: 13px; padding-top: 1px; }
  .kv dd { margin: 0 0 6px; overflow-wrap: anywhere; }

  .timeline { padding: 16px 18px; border-bottom: 1px solid var(--rule); }
  .timeline h3 { font-size: 13px; color: var(--ink-soft); font-weight: 560; margin: 0 0 12px; }
  .tl { position: relative; padding-left: 18px; }
  .tl::before { content: ""; position: absolute; left: 3px; top: 5px; bottom: 5px; width: 1px; background: var(--rule); }
  .tl .item { position: relative; padding-bottom: 14px; font-size: 14px; }
  .tl .item::before { content: ""; position: absolute; left: -18px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); }
  .tl .item .when { font-size: 12.5px; color: var(--ink-faint); }

  .actions { padding: 18px; display: grid; gap: 10px; }
  a.link { color: var(--ink); }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex;
    background: rgba(255,255,255,0.94); backdrop-filter: blur(12px);
    border-top: 1px solid var(--rule); padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    max-width: 720px; margin: 0 auto;
  }
  .tab { flex: 1; background: none; border: 0; font-family: inherit; font-size: 12px; color: var(--ink-faint); cursor: pointer; padding: 6px 0; font-weight: 520; }
  .tab[aria-current="true"] { color: var(--ink); font-weight: 620; }
  .tab .glyph { display: block; font-size: 17px; line-height: 1.3; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 92px;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px;
    font-size: 13.5px; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .18s;
    max-width: 86%; text-align: center;
  }
  .toast.show { opacity: 1; }

  /* auth */
  .auth { padding: 34px 20px 40px; max-width: 420px; margin: 0 auto; }
  .auth .logo { font-size: 13px; font-weight: 640; letter-spacing: 0.02em; color: var(--ink-soft); }
  .auth h1 { font-size: 30px; font-weight: 640; letter-spacing: -0.025em; margin: 18px 0 8px; line-height: 1.1; }
  .auth p.lede { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 26px; }
  .auth .swap { margin-top: 20px; font-size: 14px; color: var(--ink-soft); text-align: center; }
  .auth .swap button { background: none; border: 0; font-family: inherit; font-size: 14px; color: var(--ink); text-decoration: underline; cursor: pointer; padding: 0; }
  .auth .err {
    background: var(--lost-tint); color: var(--lost); padding: 11px 13px;
    border-radius: 10px; font-size: 13.5px; margin-bottom: 16px;
  }
  .auth .ok {
    background: var(--won-tint); color: var(--won); padding: 11px 13px;
    border-radius: 10px; font-size: 13.5px; margin-bottom: 16px;
  }
  .auth .fineprint { margin-top: 26px; font-size: 12px; color: var(--ink-faint); line-height: 1.5; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="root"><div class="boot">Starting up…</div></div>

<script>
(function () {
  "use strict";

  /* ================================================================
     CONFIG — the only part you need to edit.
     Paste your Firebase web config here. Leave projectId empty to run
     in device mode (no login, data saved in this browser only).
     ================================================================ */
  var FIREBASE_CONFIG = {
    apiKey: "",
    authDomain: "",
    projectId: "",
    storageBucket: "",
    messagingSenderId: "",
    appId: ""
  };

  // Optional. If set, only these email addresses can create an account,
  // e.g. "agsconsult.co.za". Enforce it in the Firestore rules too.
  var ALLOWED_EMAIL_DOMAIN = "";

  /* ================================================================ */

  var state = {
    ready: false,
    uid: null,
    profile: null,        // { name, goalDeals, goalValue }
    leads: [],            // my leads only — never leaves my account
    members: [],          // [{ uid, name, goalDeals, goalValue }]
    teamStats: {},        // uid -> aggregated numbers, no client details
    view: "boot",
    authMode: "signin",
    authError: "", authOk: "", busy: false,
    filter: "all", q: "", current: null, editing: null, focusUid: null, needsName: false,
    lastRefresh: 0
  };

  var PRODUCTS = ["Life cover", "Funeral cover", "Investment", "Retirement annuity", "Short-term insurance", "Medical cover", "Business assurance", "Other"];
  var APPROACHES = ["Needs analysis first", "Showed the numbers", "Compared to existing cover", "Free policy review", "Leaned on the referral", "Urgency / deadline", "Family protection angle", "Straight product pitch"];
  var CHANNELS = ["Phone call", "WhatsApp", "In person", "Video call", "Email", "SMS"];
  var LOSS = ["Too expensive", "Not the right time", "No budget", "Went with a competitor", "Couldn't reach them", "Spouse / partner said no", "Happy with current cover", "Not qualified", "Went quiet", "Other"];
  var OBJECTIONS = ["Price", "Trust in me / the firm", "Needed to think", "Partner had to agree", "Already covered", "No real objection"];

  /* ---------- tiny helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function today() { return new Date().toISOString().slice(0, 10); }
  function thisMonth() { return today().slice(0, 7); }
  function monthName() { return new Date().toLocaleDateString("en-ZA", { month: "long" }); }
  function fmtDate(d) {
    if (!d) return "—";
    var p = String(d).split("-");
    var m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return Number(p[2]) + " " + m[Number(p[1]) - 1] + " " + p[0];
  }
  function daysBetween(a, b) { if (!a || !b) return null; return Math.round((new Date(b) - new Date(a)) / 86400000); }
  function money(n) { if (!n && n !== 0) return "—"; return "R" + Number(n).toLocaleString("en-ZA", { maximumFractionDigits: 0 }); }
  function lastTouch(c) {
    if (!c.contacts || !c.contacts.length) return c.firstContact;
    return c.contacts.map(function (x) { return x.date; }).sort().slice(-1)[0];
  }
  function opts(list, sel, blank) {
    var h = blank ? '<option value="">' + esc(blank) + "</option>" : "";
    return h + list.map(function (o) {
      return '<option value="' + esc(o) + '"' + (o === sel ? " selected" : "") + ">" + esc(o) + "</option>";
    }).join("");
  }
  function datalist(id, values) {
    return '<datalist id="' + id + '">' + values.map(function (v) { return '<option value="' + esc(v) + '">'; }).join("") + "</datalist>";
  }
  function uniqueField(field) {
    var seen = {};
    state.leads.forEach(function (c) { if (c[field]) seen[c[field]] = 1; });
    return Object.keys(seen).sort();
  }
  function byId(id) { return state.leads.filter(function (c) { return c.id === id; })[0]; }
  function memberName(uid) {
    var m = state.members.filter(function (x) { return x.uid === uid; })[0];
    return m ? m.name : "Unknown";
  }
  var toastTimer;
  function toast(msg) {
    var el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

  /* ================================================================
     DATA LAYER

     cloud mode (Firebase config present):
       leads/{uid}    full client records. Rules: only that account reads it.
       members/{uid}  display name and monthly target. Everyone reads.
       stats/{uid}    counts and rates only, no client details. Everyone reads.

     device mode (no config): everything in localStorage, single user.
     ================================================================ */

  var DB = { mode: "device", note: "", fs: null, store: null, auth: null, authApi: null };

  DB.init = function () {
    if (!FIREBASE_CONFIG.projectId) {
      DB.note = "Running without a login. Data is saved in this browser only.";
      return Promise.resolve();
    }
    var base = "https://www.gstatic.com/firebasejs/10.12.2/";
    return Promise.all([
      import(base + "firebase-app.js"),
      import(base + "firebase-firestore.js"),
      import(base + "firebase-auth.js")
    ]).then(function (m) {
      var app = m[0].initializeApp(FIREBASE_CONFIG);
      DB.fs = m[1];
      DB.store = m[1].getFirestore(app);
      DB.authApi = m[2];
      DB.auth = m[2].getAuth(app);
      DB.mode = "cloud";
    }).catch(function (err) {
      DB.mode = "device";
      DB.note = "Couldn't reach the login service, so this is saving to your browser only. " +
        (err && err.message ? err.message : "");
      console.error("Firebase init failed:", err);
    });
  };

  function localGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function localSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast("This browser is blocking storage"); } }

  function docGet(coll, id) {
    if (DB.mode !== "cloud") return Promise.resolve(localGet(coll + ":" + id));
    return DB.fs.getDoc(DB.fs.doc(DB.store, coll, id)).then(function (snap) {
      if (!snap.exists()) return null;
      var d = snap.data();
      return d.json ? JSON.parse(d.json) : d;
    });
  }
  function docSet(coll, id, val) {
    if (DB.mode !== "cloud") { localSet(coll + ":" + id, val); return Promise.resolve(); }
    localSet(coll + ":" + id, val);
    var payload;
    if (coll === "members") {
      // Only ever these three fields. No email, no phone — this doc is readable
      // by the whole team, and the rules reject anything else anyway.
      payload = {
        name: String(val.name || "").replace(/@/g, " ").slice(0, 60),
        goalDeals: val.goalDeals || "",
        goalValue: val.goalValue || "",
        updated: new Date().toISOString()
      };
    } else {
      payload = { json: JSON.stringify(val), updated: new Date().toISOString() };
    }
    return DB.fs.setDoc(DB.fs.doc(DB.store, coll, id), payload);
  }
  function collGet(coll) {
    if (DB.mode !== "cloud") {
      var one = localGet(coll + ":" + state.uid);
      return Promise.resolve(one ? [{ id: state.uid, data: one }] : []);
    }
    return DB.fs.getDocs(DB.fs.collection(DB.store, coll)).then(function (snap) {
      var out = [];
      snap.forEach(function (d) {
        var v = d.data();
        out.push({ id: d.id, data: v.json ? JSON.parse(v.json) : v });
      });
      return out;
    });
  }

  /* ---------- stats ---------- */
  function stats(list) {
    var w = 0, l = 0, o = 0, wonValue = 0, openValue = 0, dSum = 0, dN = 0, tW = 0, tWN = 0, tL = 0, tLN = 0;
    list.forEach(function (c) {
      var t = (c.contacts || []).length;
      if (c.status === "won") {
        w++; wonValue += Number(c.value) || 0;
        var d = daysBetween(c.firstContact, c.closedDate);
        if (d !== null && d >= 0) { dSum += d; dN++; }
        tW += t; tWN++;
      } else if (c.status === "lost") { l++; tL += t; tLN++; }
      else { o++; openValue += Number(c.value) || 0; }
    });
    var closed = w + l;
    return {
      won: w, lost: l, open: o, closed: closed, total: list.length,
      rate: closed ? (w / closed) * 100 : null,
      wonValue: wonValue, openValue: openValue,
      avgDays: dN ? Math.round(dSum / dN) : null,
      avgTouchWon: tWN ? tW / tWN : null,
      avgTouchLost: tLN ? tL / tLN : null
    };
  }
  function monthStats(list) {
    var m = thisMonth(), deals = 0, value = 0, newLeads = 0;
    list.forEach(function (c) {
      if (c.status === "won" && c.closedDate && c.closedDate.slice(0, 7) === m) { deals++; value += Number(c.value) || 0; }
      if (c.firstContact && c.firstContact.slice(0, 7) === m) newLeads++;
    });
    return { deals: deals, value: value, newLeads: newLeads };
  }
  function breakdown(list, field) {
    var m = {};
    list.forEach(function (c) {
      if (c.status === "open") return;
      var k = c[field] || "Not recorded";
      if (!m[k]) m[k] = { won: 0, closed: 0 };
      m[k].closed++;
      if (c.status === "won") m[k].won++;
    });
    return Object.keys(m).map(function (k) {
      return { key: k, won: m[k].won, closed: m[k].closed, rate: (m[k].won / m[k].closed) * 100 };
    }).sort(function (a, b) { return b.rate - a.rate || b.closed - a.closed; });
  }
  function tally(list, field, status) {
    var m = {};
    list.forEach(function (c) {
      if (c.status !== status) return;
      var k = (c.close && c.close[field]) || c[field] || "Not recorded";
      m[k] = (m[k] || 0) + 1;
    });
    return Object.keys(m).map(function (k) { return { key: k, n: m[k] }; }).sort(function (a, b) { return b.n - a.n; });
  }

  // What gets shared with the team. Deliberately excludes names, phones,
  // emails, notes, and the free-text "how you got them" field — that one is
  // free text and reps type client names into it.
  function shareableStats(list) {
    var s = stats(list);
    return {
      total: s.total, won: s.won, lost: s.lost, open: s.open, closed: s.closed,
      rate: s.rate, wonValue: s.wonValue, openValue: s.openValue,
      avgDays: s.avgDays, avgTouchWon: s.avgTouchWon, avgTouchLost: s.avgTouchLost,
      month: monthStats(list),
      adverts: breakdown(list, "advert"),
      approaches: breakdown(list, "approach"),
      products: breakdown(list, "product"),
      channels: tally(list, "channel", "won"),
      losses: tally(list, "reason", "lost"),
      updated: new Date().toISOString()
    };
  }
  function blankStats() {
    return { total: 0, won: 0, lost: 0, open: 0, closed: 0, rate: null, wonValue: 0, openValue: 0,
      avgDays: null, avgTouchWon: null, avgTouchLost: null,
      month: { deals: 0, value: 0, newLeads: 0 },
      adverts: [], approaches: [], products: [], channels: [], losses: [] };
  }
  function mergeBreakdowns(arrays) {
    var m = {};
    arrays.forEach(function (arr) {
      (arr || []).forEach(function (r) {
        if (!m[r.key]) m[r.key] = { won: 0, closed: 0 };
        m[r.key].won += r.won; m[r.key].closed += r.closed;
      });
    });
    return Object.keys(m).map(function (k) {
      return { key: k, won: m[k].won, closed: m[k].closed, rate: (m[k].won / m[k].closed) * 100 };
    }).sort(function (a, b) { return b.rate - a.rate || b.closed - a.closed; });
  }
  function mergeTallies(arrays) {
    var m = {};
    arrays.forEach(function (arr) { (arr || []).forEach(function (r) { m[r.key] = (m[r.key] || 0) + r.n; }); });
    return Object.keys(m).map(function (k) { return { key: k, n: m[k] }; }).sort(function (a, b) { return b.n - a.n; });
  }
  function companyStats() {
    var all = state.members.map(function (m) { return state.teamStats[m.uid] || blankStats(); });
    var out = blankStats();
    var dSum = 0, dN = 0, twSum = 0, twN = 0, tlSum = 0, tlN = 0;
    all.forEach(function (s) {
      out.total += s.total; out.won += s.won; out.lost += s.lost; out.open += s.open;
      out.wonValue += s.wonValue; out.openValue += s.openValue;
      out.month.deals += s.month.deals; out.month.value += s.month.value; out.month.newLeads += s.month.newLeads;
      if (s.avgDays !== null && s.won) { dSum += s.avgDays * s.won; dN += s.won; }
      if (s.avgTouchWon !== null && s.won) { twSum += s.avgTouchWon * s.won; twN += s.won; }
      if (s.avgTouchLost !== null && s.lost) { tlSum += s.avgTouchLost * s.lost; tlN += s.lost; }
    });
    out.closed = out.won + out.lost;
    out.rate = out.closed ? (out.won / out.closed) * 100 : null;
    out.avgDays = dN ? Math.round(dSum / dN) : null;
    out.avgTouchWon = twN ? twSum / twN : null;
    out.avgTouchLost = tlN ? tlSum / tlN : null;
    out.adverts = mergeBreakdowns(all.map(function (s) { return s.adverts; }));
    out.approaches = mergeBreakdowns(all.map(function (s) { return s.approaches; }));
    out.products = mergeBreakdowns(all.map(function (s) { return s.products; }));
    out.channels = mergeTallies(all.map(function (s) { return s.channels; }));
    out.losses = mergeTallies(all.map(function (s) { return s.losses; }));
    return out;
  }

  /* ---------- saving ---------- */
  function saveLeads() {
    return docSet("leads", state.uid, state.leads)
      .then(function () { return docSet("stats", state.uid, shareableStats(state.leads)); })
      .then(function () { state.teamStats[state.uid] = shareableStats(state.leads); })
      .catch(function (err) {

        toast("Saved on this device but not to the server");
      });
  }
  function saveProfile() {

      console.error("Profile save failed:", err);

    });
  }

  /* ================================================================
     AUTH
     ================================================================ */
  function friendlyAuthError(err) {
    var code = (err && err.code) || "";
    if (code.indexOf("invalid-credential") > -1 || code.indexOf("wrong-password") > -1 || code.indexOf("user-not-found") > -1)
      return "That email and password don't match an account.";
    if (code.indexOf("email-already-in-use") > -1) return "There's already an account with that email. Sign in instead.";
    if (code.indexOf("weak-password") > -1) return "Password needs to be at least 8 characters.";
    if (code.indexOf("invalid-email") > -1) return "That doesn't look like an email address.";
    if (code.indexOf("too-many-requests") > -1) return "Too many attempts. Wait a few minutes and try again.";
    if (code.indexOf("network") > -1) return "No connection. Check your data and try again.";
    return (err && err.message) || "Something went wrong. Try again.";
  }

  function domainOk(email) {
    if (!ALLOWED_EMAIL_DOMAIN) return true;
    return email.toLowerCase().indexOf("@" + ALLOWED_EMAIL_DOMAIN.toLowerCase()) === email.length - ALLOWED_EMAIL_DOMAIN.length - 1;
  }

  function doSignIn(email, password) {
    state.busy = true; state.authError = ""; render();
    DB.authApi.signInWithEmailAndPassword(DB.auth, email, password)
      .then(function () { state.busy = false; })
      .catch(function (err) {
        state.busy = false; state.authError = friendlyAuthError(err); render();
      });
  }

  function doSignUp(name, email, password) {
    state.busy = true; state.authError = ""; render();
    DB.authApi.createUserWithEmailAndPassword(DB.auth, email, password)
      .then(function (cred) {
        state.profile = { name: name, goalDeals: "", goalValue: "" };
        return docSet("members", cred.user.uid, state.profile).then(function () {
          return DB.authApi.sendEmailVerification(cred.user);
        });
      })
      .then(function () { state.busy = false; })
      .catch(function (err) {
        state.busy = false; state.authError = friendlyAuthError(err); render();
      });
  }

  function doReset(email) {
    if (!email) { state.authError = "Type your email first."; render(); return; }
    state.busy = true; state.authError = ""; render();
    DB.authApi.sendPasswordResetEmail(DB.auth, email)
      .then(function () {
        state.busy = false; state.authOk = "Check your email for a reset link."; state.authMode = "signin"; render();
      })
      .catch(function (err) { state.busy = false; state.authError = friendlyAuthError(err); render(); });
  }

  function doSignOut() {
    if (DB.mode !== "cloud") return;
    DB.authApi.signOut(DB.auth);
  }

  function afterSignIn(user) {
    state.uid = user.uid;
    state.view = "boot"; render();
    Promise.all([
      docGet("members", user.uid),
      docGet("leads", user.uid),
      collGet("members"),
      collGet("stats")
    ]).then(function (r) {
      state.profile = r[0] || { name: "", goalDeals: "", goalValue: "" };
      // A name is never derived from the email address — teammates see the name.
      state.needsName = !state.profile.name || state.profile.name.indexOf("@") > -1;
      state.leads = r[1] || [];
      state.members = (r[2] || []).map(function (d) {
        return { uid: d.id, name: d.data.name || "Unnamed", goalDeals: d.data.goalDeals || "", goalValue: d.data.goalValue || "" };
      });
      if (!state.members.some(function (m) { return m.uid === user.uid; })) {
        state.members.push({ uid: user.uid, name: state.profile.name, goalDeals: "", goalValue: "" });
        saveProfile();
      }
      state.teamStats = {};
      (r[3] || []).forEach(function (d) { state.teamStats[d.id] = d.data; });
      go(state.needsName ? "goal" : "pipeline");
    }).catch(function (err) {
      console.error("Load failed:", err);
      toast("Couldn't load your data. Pull down and try again.");
      state.leads = state.leads || [];
      go("pipeline");
    });
  }

  function refreshTeam() {
    var now = Date.now();
    if (now - state.lastRefresh < 15000) { toast("Just a moment — try again in a few seconds"); return; }
    state.lastRefresh = now;
    toast("Refreshing…");
    Promise.all([collGet("members"), collGet("stats")]).then(function (r) {
      state.members = (r[0] || []).map(function (d) {
        return { uid: d.id, name: d.data.name || "Unnamed", goalDeals: d.data.goalDeals || "", goalValue: d.data.goalValue || "" };
      });
      state.teamStats = {};
      (r[1] || []).forEach(function (d) { state.teamStats[d.id] = d.data; });
      render(); toast("Up to date");
    }).catch(function (err) { console.error(err); toast("Couldn't refresh"); });
  }

  function brandbar() {
    var h = '<div class="brandbar"><span class="mark">AGS Consult</span>' +
      '<span class="who">' + esc(state.profile ? state.profile.name : "") +
      (DB.mode === "cloud" ? ' · <button data-signout="1">Sign out</button>' : "") + "</span></div>";
    if (DB.mode !== "cloud") h += '<div class="notice">' + esc(DB.note) + "</div>";
    return h;

  function rateHero(s, caption) {
    var tot = Math.max(1, s.won + s.lost + s.open);
    return '<div class="rate"><div class="fig">' + (s.rate === null ? "—" : Math.round(s.rate)) +
      (s.rate === null ? "" : '<span class="pct">%</span>') + "</div>" +
      '<div class="cap">' + esc(caption || (s.closed ? s.won + " closed out of " + s.closed + " decided" : "No deals decided yet")) + "</div>" +
      '<div class="streak"><i class="w" style="width:' + (s.won / tot * 100) + '%"></i>' +
      '<i class="l" style="width:' + (s.lost / tot * 100) + '%"></i>' +
      '<i class="o" style="width:' + (s.open / tot * 100) + '%"></i></div>' +
      '<div class="legend"><span><i class="dot w"></i>Won <b>' + s.won + "</b></span>" +
      '<span><i class="dot l"></i>Lost <b>' + s.lost + "</b></span>" +
      '<span><i class="dot o"></i>Open <b>' + s.open + "</b></span>" +
      "<span>Signed <b>" + money(s.wonValue) + "</b></span></div></div>";
  }

  function goalStrip(name, goalDeals, goalValue, ms, editable) {
    var gd = Number(goalDeals) || 0, gv = Number(goalValue) || 0;
    var pct = gd ? Math.min(100, (ms.deals / gd) * 100) : 0;
    var h = '<div class="goal">';
    h += '<div class="lab"><span>' + esc(monthName()) + " target</span><b>" + ms.deals + (gd ? " of " + gd : "") + " deals</b></div>";
    h += '<div class="track"><div class="fill' + (gd && ms.deals >= gd ? " hit" : "") + '" style="width:' + Math.max(gd ? 2 : 0, pct) + '%"></div></div>';
    h += '<div class="foot">' + money(ms.value) + (gv ? " of " + money(gv) : "") + " signed · " + ms.newLeads + " new leads this month";
    if (editable) h += ' · <button data-goal="1">' + (gd ? "Change target" : "Set a target") + "</button>";
    h += "</div></div>";
    return h;
  }

  function statRows(s) {
    return '<div class="stat"><span class="k">Conversion rate<small>Won ÷ deals that reached a decision</small></span><span class="v">' + (s.rate === null ? "—" : Math.round(s.rate) + "%") + "</span></div>" +
      '<div class="stat"><span class="k">Average days to close</span><span class="v">' + (s.avgDays === null ? "—" : s.avgDays) + "</span></div>" +
      '<div class="stat"><span class="k">Touches before a yes</span><span class="v">' + (s.avgTouchWon == null ? "—" : s.avgTouchWon.toFixed(1)) + "</span></div>" +
      '<div class="stat"><span class="k">Touches before a no</span><span class="v">' + (s.avgTouchLost == null ? "—" : s.avgTouchLost.toFixed(1)) + "</span></div>" +
      '<div class="stat"><span class="k">Signed value</span><span class="v">' + money(s.wonValue) + "</span></div>" +
      '<div class="stat"><span class="k">Still on the table</span><span class="v">' + money(s.openValue) + "</span></div>";
  }

  function meter(rows, max) {
    if (!rows || !rows.length) return '<p class="hint">Nothing closed yet.</p>';
    return rows.slice(0, max || 8).map(function (r) {
      return '<div class="meter' + (r.rate < 34 ? " neg" : "") + '"><div class="lab"><span>' + esc(r.key) +
        "</span><em>" + Math.round(r.rate) + "% · " + r.won + "/" + r.closed + "</em></div>" +
        '<div class="track"><div class="fill" style="width:' + Math.max(2, r.rate) + '%"></div></div></div>';
    }).join("");
  }
  function tallyBlock(title, hint, rows) {
    if (!rows || !rows.length) return "";
    var h = '<div class="block"><h2>' + esc(title) + '</h2><p class="hint">' + esc(hint) + "</p>";
    rows.forEach(function (r) { h += '<div class="stat"><span class="k">' + esc(r.key) + '</span><span class="v">' + r.n + "</span></div>"; });
    return h + "</div>";
  }
  function breakdownBlocks(s, includeSource) {
    var h = "";
    h += '<div class="block"><h2>Advertisement</h2><p class="hint">Which advert brings people who actually sign.</p>' + meter(s.adverts) + "</div>";
    if (includeSource) h += '<div class="block"><h2>How they were found</h2><p class="hint">Only you see this one — it\'s free text and often has names in it.</p>' + meter(includeSource) + "</div>";
    h += '<div class="block"><h2>Approach</h2><p class="hint">The angle opened with, ranked by close rate.</p>' + meter(s.approaches) + "</div>";
    h += '<div class="block"><h2>Product</h2><p class="hint">What sells best.</p>' + meter(s.products) + "</div>";
    h += tallyBlock("How the yes came in", "Channel the deal was closed on.", s.channels);
    h += tallyBlock("Why deals died", "Most common loss reasons.", s.losses);
    return h;
  }

  function leadRow(c) {
    var k = c.status === "won" ? "w" : c.status === "lost" ? "l" : "o";
    var d = daysBetween(lastTouch(c), today());
    var meta;
    if (c.status === "won") meta = "Closed " + fmtDate(c.closedDate);
    else if (c.status === "lost") meta = (c.close && c.close.reason) || "Lost";
    else meta = d === null ? "No contact logged" : d === 0 ? "Spoken to today" : d + (d === 1 ? " day" : " days") + " since contact";
    return '<button class="row" data-open="' + esc(c.id) + '">' +
      '<span class="bar ' + k + '"></span>' +
      '<span><span class="nm">' + esc(c.name) + "</span>" +
      '<span class="meta' + (c.status === "open" && d >= 7 ? " stale" : "") + '">' +
      (c.advert ? esc(c.advert) + " · " : "") + esc(meta) + "</span></span>" +
      '<span class="val">' + money(c.value) + "</span></button>";
  }

  function viewPipeline() {
    var s = stats(state.leads);
    var h = brandbar();
    h += '<div class="topline"><h1>My pipeline</h1><div class="sub">' + s.total + (s.total === 1 ? " lead" : " leads") + "</div></div>";
    h += rateHero(s);
    h += goalStrip(state.profile.name, state.profile.goalDeals, state.profile.goalValue, monthStats(state.leads), true);

    h += '<div class="filters">';
    [["all","Everyone"],["open","Open"],["won","Won"],["lost","Lost"],["stale","Needs a nudge"]].forEach(function (f) {
      h += '<button class="chip" data-filter="' + f[0] + '" aria-pressed="' + (state.filter === f[0]) + '">' + f[1] + "</button>";
    });
    h += "</div>";
    h += '<div class="searchwrap"><input class="search" id="q" placeholder="Search name, advert, product or source" value="' + esc(state.q) + '"></div>';

    var list = state.leads.filter(function (c) {
      if (state.filter === "stale") {
        if (c.status !== "open") return false;
        var d = daysBetween(lastTouch(c), today());
        return d !== null && d >= 7;
      }
      if (state.filter !== "all" && c.status !== state.filter) return false;
      if (!state.q) return true;
      return [c.name, c.advert, c.product, c.source].join(" ").toLowerCase().indexOf(state.q.toLowerCase()) > -1;
    }).sort(function (a, b) {
      var rank = { open: 0, won: 1, lost: 2 };
      if (rank[a.status] !== rank[b.status]) return rank[a.status] - rank[b.status];
      return (lastTouch(b) || "") > (lastTouch(a) || "") ? 1 : -1;
    });

    if (!list.length) {
      h += '<div class="empty"><b>' + (state.leads.length ? "Nothing matches that" : "No leads logged yet") + "</b>" +
        (state.leads.length ? "Clear the search or pick another filter." : "Tap Add to log the first person you spoke to.") + "</div>";
    } else {
      h += '<div class="ledger">';
      list.forEach(function (c) { h += leadRow(c); });
      h += "</div>";
    }
    return h;
  }

    h += '<div class="dhead"><h2>' + esc(m.name) + '</h2><div class="co">' + s.total + (s.total === 1 ? " lead" : " leads") + " logged</div></div>";
    h += rateHero(s);
    h += goalStrip(m.name, m.goalDeals, m.goalValue, s.month, mine);
    h += '<div class="block">' + statRows(s) + "</div>";
    h += '<div class="block"><h2>Open work</h2>' +
      '<div class="stat"><span class="k">Leads waiting on an outcome</span><span class="v">' + s.open + "</span></div>" +
      '<div class="stat"><span class="k">Value in those leads</span><span class="v">' + money(s.openValue) + "</span></div>" +
      '<div class="stat"><span class="k">New leads this month</span><span class="v">' + s.month.newLeads + "</span></div></div>";
    if (s.closed) h += breakdownBlocks(s, mine ? breakdown(state.leads, "source") : null);
    if (!mine) h += '<div class="fineprint" style="padding:16px 18px;color:#93A1AD;font-size:12px">Client names and contact details stay with the rep who captured them.</div>';
    return h;
  }

  function viewCompany() {
    var cs = companyStats();
    var h = brandbar() + '<div class="topline"><h1>Company numbers</h1></div>';
    h += '<div class="block">' + statRows(cs) + "</div>";
    if (!cs.closed) return h + '<div class="empty"><b>Rates appear once deals close</b>Once the team starts marking leads won or lost, everything below fills in.</div>';
    h += breakdownBlocks(cs, null);
    return h;
  }

  function viewDetail() {
    var c = byId(state.current);
    if (!c) return brandbar() + '<div class="empty"><b>Lead not found</b></div>';
    var k = c.status === "won" ? "w" : c.status === "lost" ? "l" : "o";
    var label = c.status === "won" ? "Won" : c.status === "lost" ? "Lost" : "Open";

    var h = '<div class="backbar"><button data-go="pipeline">← Pipeline</button></div>';
    h += '<div class="dhead"><h2>' + esc(c.name) + "</h2>";
    if (c.advert) h += '<div class="co">Came in on: ' + esc(c.advert) + "</div>";
    h += '<span class="tag ' + k + '">' + label + (c.status !== "open" ? " · " + fmtDate(c.closedDate) : "") + "</span></div>";

    h += '<dl class="kv">';
    function kv(a, b) { if (b) h += "<dt>" + esc(a) + "</dt><dd>" + b + "</dd>"; }
    kv("Phone", c.phone ? '<a class="link" href="tel:' + esc(c.phone) + '">' + esc(c.phone) + "</a>" : "");
    kv("Email", c.email ? '<a class="link" href="mailto:' + esc(c.email) + '">' + esc(c.email) + "</a>" : "");
    kv("Product", esc(c.product));
    kv("Value", c.value ? money(c.value) : "");
    kv("How you got them", esc(c.source));
    kv("Approach", esc(c.approach));
    kv("First contact", fmtDate(c.firstContact));
    if (c.status === "won") {
      kv("Days to close", daysBetween(c.firstContact, c.closedDate));
      kv("Closed on", esc(c.close && c.close.channel));
      kv("What sealed it", esc(c.close && c.close.sealed));
      kv("Objection", esc(c.close && c.close.objection));
      kv("Worth repeating", esc(c.close && c.close.detail));
    }
    if (c.status === "lost") {
      kv("Reason", esc(c.close && c.close.reason));
      kv("Detail", esc(c.close && c.close.detail));
    }
    kv("Notes", c.notes ? esc(c.notes).replace(/\n/g, "<br>") : "");
    h += "</dl>";

    h += '<div class="timeline"><h3>Contact history</h3><div class="tl">';
    var ev = (c.contacts || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    if (!ev.length) h += '<div class="item"><div class="when">' + fmtDate(c.firstContact) + "</div><div>First contact</div></div>";
    else ev.forEach(function (e) {
      h += '<div class="item"><div class="when">' + fmtDate(e.date) + " · " + esc(e.channel) + "</div><div>" + esc(e.note || "Contacted") + "</div></div>";
    });
    h += "</div></div>";

    h += '<div class="actions"><button class="btn" data-go="log">Log a contact</button>';
    if (c.status === "open") {
      h += '<div class="btnrow"><button class="btn won" data-go="close-won">Mark won</button><button class="btn lost" data-go="close-lost">Mark lost</button></div>';
    } else {
      h += '<button class="btn ghost" data-reopen="1">Reopen this deal</button>';
    }
    h += '<button class="btn ghost" data-go="edit">Edit details</button>';
    h += '<button class="btn danger" data-delete="1">Delete lead</button></div>';
    return h;
  }

  function viewForm() {
    var c = state.editing || {};
    var isNew = !c.id;
    var h = '<div class="backbar"><button data-go="' + (isNew ? "pipeline" : "detail") + '">← Cancel</button></div>';
    h += '<div class="topline"><h1>' + (isNew ? "New lead" : "Edit lead") + "</h1></div>";
    h += '<div class="pad"><div class="formwrap" id="clientform">';
    h += '<div class="field"><label for="f-name">Name</label><input id="f-name" value="' + esc(c.name || "") + '"></div>';
    h += '<div class="field"><label for="f-advert">Which advertisement</label><input id="f-advert" list="dl-advert" placeholder="Facebook funeral cover ad, October flyer…" value="' + esc(c.advert || "") + '">' +
      datalist("dl-advert", uniqueField("advert")) + '<div class="note">Type it the same way every time so the numbers group properly.</div></div>';
    h += '<div class="pair"><div class="field"><label for="f-phone">Phone</label><input id="f-phone" type="tel" value="' + esc(c.phone || "") + '"></div>';
    h += '<div class="field"><label for="f-email">Email</label><input id="f-email" type="email" value="' + esc(c.email || "") + '"></div></div>';
    h += '<div class="field"><label for="f-source">How you got them</label><input id="f-source" list="dl-source" placeholder="Referral, walked into the office, WhatsApp status…" value="' + esc(c.source || "") + '">' +
      datalist("dl-source", uniqueField("source")) + "</div>";
    h += '<div class="field"><label for="f-product">Product they need</label><select id="f-product">' + opts(PRODUCTS, c.product, "Pick one") + "</select></div>";
    h += '<div class="pair"><div class="field"><label for="f-value">Value in rand</label><input id="f-value" type="number" inputmode="numeric" value="' + esc(c.value || "") + '"></div>';
    h += '<div class="field"><label for="f-first">First contacted</label><input id="f-first" type="date" value="' + esc(c.firstContact || today()) + '"></div></div>';
    h += '<div class="field"><label for="f-approach">Approach you used</label><select id="f-approach">' + opts(APPROACHES, c.approach, "Pick one") + "</select></div>";
    h += '<div class="field"><label for="f-notes">Everything else you know</label><textarea id="f-notes" placeholder="Family, existing cover, what they care about, when to call back">' + esc(c.notes || "") + '</textarea><div class="note">Don\'t put ID numbers or bank details in here.</div></div>';
    h += '<button class="btn" data-submit="clientform">' + (isNew ? "Add lead" : "Save changes") + "</button></div></div>";
    return h;
  }

  function viewLog() {
    var c = byId(state.current);
    var h = '<div class="backbar"><button data-go="detail">← Cancel</button></div>';
    h += '<div class="topline"><h1>Log a contact</h1><div class="sub">' + esc(c.name) + "</div></div>";
    h += '<div class="pad"><div class="formwrap" id="logform">';
    h += '<div class="field"><label for="l-date">Date</label><input id="l-date" type="date" value="' + today() + '"></div>';
    h += '<div class="field"><label for="l-channel">Channel</label><select id="l-channel">' + opts(CHANNELS, "Phone call") + "</select></div>";
    h += '<div class="field"><label for="l-note">What happened</label><textarea id="l-note" placeholder="Left a voicemail. Asked for a quote on funeral cover for both parents."></textarea></div>';
    h += '<button class="btn" data-submit="logform">Save contact</button></div></div>';
    return h;
  }

  function viewClose(won) {
    var c = byId(state.current);
    var h = '<div class="backbar"><button data-go="detail">← Cancel</button></div>';
    h += '<div class="topline"><h1>' + (won ? "How did you close it?" : "Why did it fall through?") + '</h1><div class="sub">' + esc(c.name) + "</div></div>";
    h += '<div class="pad"><div class="formwrap" id="closeform" data-won="' + (won ? "1" : "0") + '">';
    h += '<div class="field"><label for="c-date">Date</label><input id="c-date" type="date" value="' + today() + '"></div>';
    if (won) {
      h += '<div class="field"><label for="c-value">Final value in rand</label><input id="c-value" type="number" inputmode="numeric" value="' + esc(c.value || "") + '"></div>';
      h += '<div class="field"><label for="c-channel">Where the yes happened</label><select id="c-channel">' + opts(CHANNELS, "In person") + "</select></div>";
      h += '<div class="field"><label for="c-sealed">What sealed it</label><select id="c-sealed">' + opts(APPROACHES, c.approach) + "</select></div>";
      h += '<div class="field"><label for="c-objection">Biggest objection you handled</label><select id="c-objection">' + opts(OBJECTIONS, "No real objection") + "</select></div>";
      h += '<div class="field"><label for="c-detail">Anything you\'d repeat next time</label><textarea id="c-detail" placeholder="Sent the comparison table before the call. She had it open when we spoke."></textarea></div>';
      h += '<button class="btn won" data-submit="closeform">Mark won</button>';
    } else {
      h += '<div class="field"><label for="c-reason">Main reason</label><select id="c-reason">' + opts(LOSS, "", "Pick one") + "</select></div>";
      h += '<div class="field"><label for="c-detail">What actually happened</label><textarea id="c-detail" placeholder="Wanted cover but the premium was R400 over his budget. Said to call in March."></textarea></div>';
      h += '<button class="btn lost" data-submit="closeform">Mark lost</button>';
    }
    h += "</div></div>";
    return h;
  }

  function viewGoal() {
    var p = state.profile;
    var h = state.needsName ? "" : '<div class="backbar"><button data-go="pipeline">← Cancel</button></div>';
    h += '<div class="topline"><h1>' + (state.needsName ? "Finish your profile" : "My profile and target") + "</h1></div>";
    h += '<div class="pad"><div class="formwrap" id="goalform">';
    h += '<div class="field"><label for="g-name">Name shown to the team</label><input id="g-name" value="' + esc(p.name || "") + '">' +
      '<div class="note">This is the only thing teammates see about you. Your email address and phone number are never shown to them.</div></div>';
    h += '<div class="field"><label for="g-deals">Deals to close each month</label><input id="g-deals" type="number" inputmode="numeric" value="' + esc(p.goalDeals || "") + '"></div>';
    h += '<div class="field"><label for="g-value">Value to sign each month</label><input id="g-value" type="number" inputmode="numeric" value="' + esc(p.goalValue || "") + '"><div class="note">A rough number is fine — it only drives the progress bar.</div></div>';
    h += '<button class="btn" data-submit="goalform">Save</button></div></div>';
    return h;
  }

  /* ---------- render ---------- */
  function render() {
    var body, tabs = "";
    if (state.view === "boot") { document.getElementById("root").innerHTML = '<div class="boot">Loading…</div>'; return; }

    if (state.view === "auth") body = viewAuth();
    else if (state.view === "verify") body = viewVerify();
    else if (state.view === "pipeline") body = viewPipeline();
    else if (state.view === "insights") body = viewInsights();
    else if (state.view === "team") body = viewTeam();
    else if (state.view === "member") body = viewMember();
    else if (state.view === "company") body = viewCompany();
    else if (state.view === "detail") body = viewDetail();
    else if (state.view === "edit") body = viewForm();
    else if (state.view === "log") body = viewLog();
    else if (state.view === "close-won") body = viewClose(true);
    else if (state.view === "close-lost") body = viewClose(false);
    else if (state.view === "goal") body = viewGoal();

    if (state.view !== "auth" && state.view !== "verify") {
      tabs = '<nav class="tabbar">' +
        '<button class="tab" data-tab="pipeline" aria-current="' + (state.view === "pipeline") + '"><span class="glyph">▤</span>Pipeline</button>' +
        '<button class="tab" data-tab="new" aria-current="' + (state.view === "edit") + '"><span class="glyph">＋</span>Add</button>' +
        '<button class="tab" data-tab="insights" aria-current="' + (state.view === "insights") + '"><span class="glyph">◑</span>Mine</button>' +
        '<button class="tab" data-tab="team" aria-current="' + (state.view === "team" || state.view === "member") + '"><span class="glyph">◍</span>Team</button>' +
        '<button class="tab" data-tab="company" aria-current="' + (state.view === "company") + '"><span class="glyph">◈</span>Company</button></nav>';
    }
    document.getElementById("root").innerHTML = '<div class="screen">' + body + "</div>" + tabs + '<div class="toast" id="toast"></div>';
  }
  function go(v) { state.view = v; render(); window.scrollTo(0, 0); }

  /* ---------- form handling (no <form> tags: they don't submit in some frames) ---------- */
  function submitForm(id) {
    var f = document.getElementById(id);
    if (!f) return;
    var val = function (i) { var el = document.getElementById(i); return el ? el.value.trim() : ""; };

    if (id === "authform") {
      var email = val("a-email"), pass = val("a-pass"), nm = val("a-name");
      if (state.authMode === "reset") { doReset(email); return; }
      if (!email || !pass) { state.authError = "Fill in both fields."; render(); return; }
      if (state.authMode === "signup") {
        if (!nm) { state.authError = "Type your name so the team knows who you are."; render(); return; }
        if (nm.indexOf("@") > -1) { state.authError = "Use your name here, not an email address. Teammates see this."; render(); return; }
        if (pass.length < 8) { state.authError = "Password needs to be at least 8 characters."; render(); return; }
        if (!domainOk(email)) { state.authError = "Only @" + ALLOWED_EMAIL_DOMAIN + " addresses can register."; render(); return; }
        state.pendingEmail = email;
        doSignUp(nm, email, pass);
      } else {
        state.pendingEmail = email;
        doSignIn(email, pass);
      }
      return;
    }

    if (id === "goalform") {
      var newName = val("g-name");
      if (!newName) { toast("Your name can't be blank"); return; }
      if (newName.indexOf("@") > -1) { toast("Use your name, not an email address"); return; }
      state.profile.name = newName;
      state.needsName = false;
      state.profile.goalDeals = val("g-deals");
      state.profile.goalValue = val("g-value");
      var me = state.members.filter(function (m) { return m.uid === state.uid; })[0];
      if (me) { me.name = state.profile.name; me.goalDeals = state.profile.goalDeals; me.goalValue = state.profile.goalValue; }
      saveProfile().then(function () { go("pipeline"); toast("Saved"); });
      return;
    }

    if (id === "clientform") {
      if (!val("f-name")) { toast("Add a name first"); return; }
      var editing = state.editing;
      var rec = editing || { id: "l" + Date.now() + Math.floor(Math.random() * 999), status: "open", contacts: [] };
      rec.name = val("f-name"); rec.advert = val("f-advert"); rec.phone = val("f-phone");
      rec.email = val("f-email"); rec.source = val("f-source"); rec.product = val("f-product");
      rec.value = val("f-value"); rec.firstContact = val("f-first");
      rec.approach = val("f-approach"); rec.notes = val("f-notes");
      if (!editing) { state.leads.push(rec); state.current = rec.id; }
      state.editing = null;
      saveLeads().then(function () { go("detail"); toast(editing ? "Changes saved" : "Lead added"); });
      return;
    }

    if (id === "logform") {
      var c = byId(state.current);
      c.contacts = c.contacts || [];
      c.contacts.push({ date: val("l-date"), channel: val("l-channel"), note: val("l-note") });
      saveLeads().then(function () { go("detail"); toast("Contact logged"); });
      return;
    }

    if (id === "closeform") {
      var won = f.dataset.won === "1";
      var cl = byId(state.current);
      cl.closedDate = val("c-date");
      if (won) {
        cl.value = val("c-value");
        cl.close = { channel: val("c-channel"), sealed: val("c-sealed"), objection: val("c-objection"), detail: val("c-detail") };
      } else {
        if (!val("c-reason")) { toast("Pick a reason"); return; }
        cl.close = { reason: val("c-reason"), detail: val("c-detail") };
      }
      cl.status = won ? "won" : "lost";
      saveLeads().then(function () { go("detail"); toast(won ? "Marked won" : "Marked lost"); });
      return;
    }
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-submit],[data-auth],[data-verified],[data-resend],[data-signout],[data-refresh],[data-tab],[data-open],[data-go],[data-filter],[data-member],[data-goal],[data-reopen],[data-delete],#export");
    if (!t) return;

    if (t.dataset.submit) { submitForm(t.dataset.submit); return; }
    if (t.dataset.auth) { state.authMode = t.dataset.auth; state.authError = ""; state.authOk = ""; render(); return; }
    if (t.dataset.verified) {
      var u = DB.auth.currentUser;
      if (!u) { go("auth"); return; }
      u.reload().then(function () {
        if (DB.auth.currentUser.emailVerified) afterSignIn(DB.auth.currentUser);
        else { state.authError = "Not verified yet. Open the link in the email first."; render(); }
      });
      return;
    }
    if (t.dataset.resend) {
      DB.authApi.sendEmailVerification(DB.auth.currentUser)
        .then(function () { toast("Sent again"); })
        .catch(function (err) { toast(friendlyAuthError(err)); });
      return;
    }
    if (t.dataset.signout) { doSignOut(); return; }
    if (t.dataset.refresh) { refreshTeam(); return; }
    if (t.dataset.tab) {
      if (t.dataset.tab === "new") { state.editing = null; go("edit"); }
      else go(t.dataset.tab);
      return;
    }
    if (t.dataset.member) { state.focusUid = t.dataset.member; go("member"); return; }
    if (t.dataset.goal) { go("goal"); return; }
    if (t.dataset.open) { state.current = t.dataset.open; go("detail"); return; }
    if (t.dataset.go) {
      if (t.dataset.go === "edit") state.editing = byId(state.current);
      go(t.dataset.go);
      return;
    }
    if (t.dataset.filter) { state.filter = t.dataset.filter; render(); return; }
    if (t.dataset.reopen) {
      var c = byId(state.current);
      c.status = "open"; c.closedDate = null; c.close = null;
      saveLeads().then(function () { render(); toast("Back in the pipeline"); });
      return;
    }
    if (t.dataset.delete) {
      if (!confirm("Delete this lead and their history? This can't be undone.")) return;
      state.leads = state.leads.filter(function (x) { return x.id !== state.current; });
      saveLeads().then(function () { go("pipeline"); toast("Lead deleted"); });
      return;
    }
    if (t.id === "export") { exportCsv(); return; }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "q") {
      state.q = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var el = document.getElementById("q");
      if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (!e.target.matches || !e.target.matches("input")) return;
    var wrap = e.target.closest(".formwrap");
    if (!wrap) return;
    e.preventDefault();
    submitForm(wrap.id);
  });

  function exportCsv() {
    var cols = ["Name","Advertisement","Phone","Email","How they were found","Product","Value","Approach","First contact","Status","Closed","Days to close","Touches","Close channel","What sealed it","Objection","Loss reason","Detail","Notes"];
    var rows = state.leads.map(function (c) {
      var cl = c.close || {};
      return [c.name, c.advert, c.phone, c.email, c.source, c.product, c.value, c.approach,
        c.firstContact, c.status, c.closedDate || "",
        c.status === "won" ? (daysBetween(c.firstContact, c.closedDate) || "") : "",
        (c.contacts || []).length, cl.channel || "", cl.sealed || "", cl.objection || "",
        cl.reason || "", cl.detail || "", c.notes || ""];
    });
    var csv = [cols].concat(rows).map(function (r) {
      return r.map(function (x) { return '"' + String(x == null ? "" : x).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "my-leads-" + today() + ".csv";
    a.click();
    toast("CSV downloaded — it has client details in it, keep it safe");
  }

  /* ---------- boot ---------- */
  DB.init().then(function () {
    if (DB.mode !== "cloud") {
      state.uid = "device";
      return Promise.all([docGet("members", "device"), docGet("leads", "device")]).then(function (r) {
        state.profile = r[0] || { name: "Me", goalDeals: "", goalValue: "" };
        state.leads = r[1] || [];
        state.members = [{ uid: "device", name: state.profile.name, goalDeals: state.profile.goalDeals, goalValue: state.profile.goalValue }];
        state.teamStats = {}; state.teamStats["device"] = shareableStats(state.leads);
        go("pipeline");
      });
    }
    DB.authApi.onAuthStateChanged(DB.auth, function (user) {
      if (!user) {
        state.uid = null; state.leads = []; state.profile = null;
        state.members = []; state.teamStats = {};
        state.authMode = "signin"; state.busy = false;
        go("auth");
        return;
      }
      if (!user.emailVerified) { go("verify"); return; }
      afterSignIn(user);
    });
  });
})();
</script>
</body>
</html>
